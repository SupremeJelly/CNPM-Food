name: CI/CD Pipeline - Docker Desktop K8s

on:
  push:
    branches:
      - main
      - src
  workflow_dispatch:  # Cho phép trigger manual

jobs:
  build-and-deploy:
    runs-on: self-hosted  # Chạy trên máy local với Docker Desktop
    # runs-on: ubuntu-latest  # Uncomment nếu deploy lên cloud

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1️⃣ Đăng nhập vào DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # 2️⃣ Build & push image cho từng service
      - name: Build and Push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: onlykohi/cnpm-api-gateway:latest

      # Có thể thêm các service khác tương tự
      - name: Build and Push user-service
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: true
          tags: onlykohi/cnpm-user-service:latest

      - name: Build and Push order-service
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          push: true
          tags: onlykohi/cnpm-order-service:latest

      - name: Build and Push restaurant-service
        uses: docker/build-push-action@v5
        with:
          context: ./restaurant-service
          push: true
          tags: onlykohi/cnpm-restaurant-service:latest

      - name: Build and Push payment-service
        uses: docker/build-push-action@v5
        with:
          context: ./payment-service
          push: true
          tags: onlykohi/cnpm-payment-service:latest

      - name: Build and Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: onlykohi/cnpm-frontend:latest

      # 3️⃣ Verify Docker Desktop Kubernetes
      - name: Check Kubernetes context
        run: |
          kubectl config current-context
          kubectl cluster-info
          kubectl get nodes

      # 4️⃣ Deploy to Docker Desktop Kubernetes
      - name: Deploy MySQL
        run: |
          kubectl apply -f k8s/services/mysql-deployment.yaml
          echo "Waiting for MySQL to be ready..."
          kubectl wait --for=condition=ready pod -l app=mysql -n cnpm-food --timeout=300s

      - name: Deploy Microservices
        run: |
          kubectl apply -f k8s/services/user-service-deployment.yaml
          kubectl apply -f k8s/services/restaurant-service-deployment.yaml
          kubectl apply -f k8s/services/order-service-deployment.yaml
          kubectl apply -f k8s/services/payment-service-deployment.yaml
          kubectl apply -f k8s/services/api-gateway-deployment.yaml
          kubectl apply -f k8s/services/frontend-deployment.yaml

      - name: Wait for deployments to be ready
        run: |
          echo "Waiting for services to be ready (this may take 2-3 minutes)..."
          kubectl rollout status deployment/user-service -n cnpm-food --timeout=5m
          kubectl rollout status deployment/restaurant-service -n cnpm-food --timeout=5m
          kubectl rollout status deployment/order-service -n cnpm-food --timeout=5m
          kubectl rollout status deployment/payment-service -n cnpm-food --timeout=5m
          kubectl rollout status deployment/api-gateway -n cnpm-food --timeout=5m
          kubectl rollout status deployment/frontend -n cnpm-food --timeout=5m

      # 5️⃣ Deploy Monitoring (Optional)
      - name: Deploy Monitoring Stack
        run: |
          kubectl apply -f k8s/monitoring/prometheus-deployment.yaml
          kubectl apply -f k8s/monitoring/grafana-deployment.yaml
        continue-on-error: true  # Không fail nếu monitoring có vấn đề

      # 6️⃣ Verify deployment
      - name: Verify Deployment
        run: |
          echo "=== Pods Status ==="
          kubectl get pods -n cnpm-food
          echo ""
          echo "=== Services ==="
          kubectl get svc -n cnpm-food
          echo ""
          echo "=== Deployment Summary ==="
          kubectl get deployments -n cnpm-food
          echo ""
          echo "=== Monitoring Pods ==="
          kubectl get pods -n monitoring
