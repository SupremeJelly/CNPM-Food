name: CI/CD Pipeline - Kubernetes

on:
  push:
    branches: [ main, src ]
  workflow_dispatch:

concurrency:
  group: deploy-k8s-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  NAMESPACE: cnpm-food

jobs:
  build-and-deploy:
    runs-on: self-hosted
    environment: staging
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: changes
        shell: pwsh
        run: |
          $diff = git diff --name-only HEAD~1 HEAD
          if (-not $diff) { $diff = "" }
          Write-Host "Changed files:\n$diff"
          echo "CHANGED_PATHS=$diff" >> $env:GITHUB_ENV


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Build & push images (tag latest + commit SHA)
      - name: Build and Push API Gateway
        if: contains(env.CHANGED_PATHS, 'api-gateway/')
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: |
            onlykohi/cnpm-api-gateway:latest
            onlykohi/cnpm-api-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push user-service
        if: contains(env.CHANGED_PATHS, 'user-service/')
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: true
          tags: |
            onlykohi/cnpm-user-service:latest
            onlykohi/cnpm-user-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push order-service
        if: contains(env.CHANGED_PATHS, 'order-service/')
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          push: true
          tags: |
            onlykohi/cnpm-order-service:latest
            onlykohi/cnpm-order-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push restaurant-service
        if: contains(env.CHANGED_PATHS, 'restaurant-service/')
        uses: docker/build-push-action@v5
        with:
          context: ./restaurant-service
          push: true
          tags: |
            onlykohi/cnpm-restaurant-service:latest
            onlykohi/cnpm-restaurant-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push payment-service
        if: contains(env.CHANGED_PATHS, 'payment-service/')
        uses: docker/build-push-action@v5
        with:
          context: ./payment-service
          push: true
          tags: |
            onlykohi/cnpm-payment-service:latest
            onlykohi/cnpm-payment-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push frontend
        if: contains(env.CHANGED_PATHS, 'frontend/')
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            onlykohi/cnpm-frontend:latest
            onlykohi/cnpm-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Set up kubectl and configure KUBECONFIG (requires KUBE_CONFIG_DATA secret)
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        shell: pwsh
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          $kubeDir = Join-Path $HOME ".kube"
          New-Item -ItemType Directory -Path $kubeDir -Force | Out-Null
          if ($env:KUBE_CONFIG_DATA -and $env:KUBE_CONFIG_DATA.Trim().Length -gt 0) {
            [System.IO.File]::WriteAllBytes((Join-Path $kubeDir "config"), [System.Convert]::FromBase64String($env:KUBE_CONFIG_DATA))
          } else {
            Write-Host "KUBE_CONFIG_DATA not set; using existing kubeconfig on runner"
          }
          kubectl version --client=true
          kubectl config current-context
          kubectl cluster-info

      - name: Prepare MySQL Deployment
        shell: pwsh
        run: |
          # Namespaces
          kubectl create namespace $env:NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -

          $initChanged = $false
          if ($env:CHANGED_PATHS -and $env:CHANGED_PATHS.Contains('mysql-init/')) { $initChanged = $true }
          $mysqlExists = (kubectl get deploy/mysql -n $env:NAMESPACE --ignore-not-found | Select-String 'mysql')
          if ($mysqlExists -and -not $initChanged) {
            Write-Host 'MySQL already exists and init.sql unchanged – skipping redeploy.'
          } else {
            Write-Host 'Applying (or reapplying) MySQL resources.'
            kubectl create configmap mysql-init-script -n $env:NAMESPACE --from-file=init.sql=mysql-init/init.sql --dry-run=client -o yaml | kubectl apply -f -
            kubectl apply -n $env:NAMESPACE -f k8s/services/mysql-deployment.yaml
            Write-Host 'Waiting for MySQL to be ready...'
            kubectl wait --for=condition=ready pod -l app=mysql -n $env:NAMESPACE --timeout=300s
          }

      - name: Deploy Microservices
        shell: pwsh
        run: |
          Write-Host "Cleaning old deployments..."
          $files = @(
            "user-service-deployment.yaml",
            "restaurant-service-deployment.yaml",
            "order-service-deployment.yaml",
            "payment-service-deployment.yaml",
            "api-gateway-deployment.yaml",
            "frontend-deployment.yaml"
          )
          foreach ($f in $files) {
            kubectl delete -n $env:NAMESPACE -f ("k8s/services/" + $f) --ignore-not-found
          }

          Write-Host "Applying new deployments..."
          foreach ($f in $files) {
            kubectl apply -n $env:NAMESPACE -f ("k8s/services/" + $f)
          }

          Write-Host "Updating images to commit SHA for deterministic rollout..."
          kubectl set image deployment/user-service user-service=onlykohi/cnpm-user-service:${{ github.sha }} -n $env:NAMESPACE
          kubectl set image deployment/restaurant-service restaurant-service=onlykohi/cnpm-restaurant-service:${{ github.sha }} -n $env:NAMESPACE
          kubectl set image deployment/order-service order-service=onlykohi/cnpm-order-service:${{ github.sha }} -n $env:NAMESPACE
          kubectl set image deployment/payment-service payment-service=onlykohi/cnpm-payment-service:${{ github.sha }} -n $env:NAMESPACE
          kubectl set image deployment/api-gateway api-gateway=onlykohi/cnpm-api-gateway:${{ github.sha }} -n $env:NAMESPACE
          kubectl set image deployment/frontend frontend=onlykohi/cnpm-frontend:${{ github.sha }} -n $env:NAMESPACE

      - name: Wait for deployments to be ready
        shell: pwsh
        run: |
          Write-Host "Waiting for services to be ready (this may take a few minutes)..."
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $failed = @()
          $deployments = @("user-service","restaurant-service","order-service","payment-service","api-gateway","frontend")
          foreach ($d in $deployments) {
            kubectl rollout status deployment/$d -n $env:NAMESPACE --timeout=7m
            if ($LASTEXITCODE -ne 0) {
              "Deployment $d failed to roll out" | Tee-Object -FilePath artifacts/rollout_failures.txt -Append | Out-Null
              $failed += $d
              kubectl describe deployment/$d -n $env:NAMESPACE | Out-File -FilePath ("artifacts/" + $d + "-describe.txt") -Encoding utf8
              kubectl get pods -l app=$d -n $env:NAMESPACE -o wide | Out-File -FilePath ("artifacts/" + $d + "-pods.txt") -Encoding utf8
              $pods = (kubectl get pods -l app=$d -n $env:NAMESPACE -o jsonpath='{.items[*].metadata.name}').Split(' ',[System.StringSplitOptions]::RemoveEmptyEntries)
              foreach ($p in $pods) {
                kubectl logs $p -n $env:NAMESPACE --tail=300 | Out-File -FilePath ("artifacts/" + $d + "-pod-" + $p + "-logs.txt") -Encoding utf8
              }
            }
          }
          if ($failed.Count -gt 0) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("One or more deployments failed: " + ($failed -join ' '))
          }

      - name: Verify MySQL schema/users (debug)
        shell: pwsh
        run: |
          echo "Checking MySQL users and databases..."
          kubectl exec deploy/mysql -n $env:NAMESPACE -- mysql -uroot -prootpass -e "SHOW DATABASES; SELECT user,host FROM mysql.user;" | Out-File -FilePath artifacts/mysql-users.txt -Encoding utf8
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "MySQL check complete"

      # Monitoring stack deploy removed for performance; re-add if required.

      - name: Apply Ingress (optional)
        shell: pwsh
        run: |
          if (Test-Path "k8s/ingress.yaml") { kubectl apply -f k8s/ingress.yaml }
        continue-on-error: true

      - name: Verify & Summarize
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          kubectl get nodes -o wide | Out-File artifacts/nodes.txt -Encoding utf8
          kubectl get pods -n $env:NAMESPACE -o wide | Out-File artifacts/pods.txt -Encoding utf8
          kubectl get svc -n $env:NAMESPACE -o wide | Out-File artifacts/services.txt -Encoding utf8
          kubectl get deployments -n $env:NAMESPACE -o wide | Out-File artifacts/deployments.txt -Encoding utf8
          kubectl get events -n $env:NAMESPACE --sort-by=.lastTimestamp | Out-File artifacts/events.txt -Encoding utf8
          kubectl describe pods -n $env:NAMESPACE | Out-File artifacts/describe_pods.txt -Encoding utf8
          kubectl logs -l app=api-gateway -n $env:NAMESPACE --tail=200 | Out-File artifacts/api-gateway-logs.txt -Encoding utf8
          kubectl logs -l app=frontend -n $env:NAMESPACE --tail=200 | Out-File artifacts/frontend-logs.txt -Encoding utf8

          $summary = @()
          $summary += "## Deployment Summary"
          $summary += ""
          $summary += "### Services ($env:NAMESPACE)"
          $summary += (kubectl get svc -n $env:NAMESPACE)
          $summary += ""
          $summary += "### Pods ($env:NAMESPACE)"
          $summary += (kubectl get pods -n $env:NAMESPACE)
          $summary += ""
          $summary += "### Failed Rollouts"
          if (Test-Path artifacts/rollout_failures.txt) { $summary += (Get-Content artifacts/rollout_failures.txt) } else { $summary += "None" }
          ($summary -join "`n") | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload diagnostics artifact (only on failures)
        if: always() && exists('artifacts/rollout_failures.txt')
        uses: actions/upload-artifact@v4
        with:
          name: k8s-diagnostics
          path: artifacts
