name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - src

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1️⃣ Đăng nhập vào DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 2️⃣ Build & push image cho từng service
      - name: Build and Push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: onlykohi/cnpm-api-gateway:latest

      # Có thể thêm các service khác tương tự
      - name: Build and Push user-service
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: true
          tags: onlykohi/cnpm-user-service:latest

      - name: Build and Push order-service
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          push: true
          tags: onlykohi/cnpm-order-service:latest

      - name: Build and Push restaurant-service
        uses: docker/build-push-action@v5
        with:
          context: ./restaurant-service
          push: true
          tags: onlykohi/cnpm-restaurant-service:latest

      - name: Build and Push payment-service
        uses: docker/build-push-action@v5
        with:
          context: ./payment-service
          push: true
          tags: onlykohi/cnpm-payment-service:latest

      - name: Build and Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: onlykohi/cnpm-frontend:latest

      # 3️⃣ Kết nối tới Kubernetes cluster (ví dụ: Render hoặc AKS)
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      # 4️⃣ Cấu hình kubeconfig từ secret (Render hoặc AKS)
      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      # 5️⃣ Deploy các YAML file
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/api-gateway -n cnpm-food
