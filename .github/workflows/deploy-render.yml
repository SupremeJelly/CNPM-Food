name: Build and Push to Docker Hub for Render

on:
  push:
    branches: [ main, src ]
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      user-service: ${{ steps.changes.outputs.user-service }}
      restaurant-service: ${{ steps.changes.outputs.restaurant-service }}
      order-service: ${{ steps.changes.outputs.order-service }}
      payment-service: ${{ steps.changes.outputs.payment-service }}
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
      frontend: ${{ steps.changes.outputs.frontend }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        run: |
          # Get changed files between current commit and previous commit
          if [ "${{ github.event_name }}" == "push" ]; then
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          else
            # For workflow_dispatch, check all files
            CHANGED_FILES=$(git ls-files)
          fi
          
          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo ""
          
          # Check each service for changes
          if echo "$CHANGED_FILES" | grep -q "^user-service/"; then
            echo "✅ user-service has changes"
            echo "user-service=true" >> $GITHUB_OUTPUT
          else
            echo "⏭️ user-service unchanged"
            echo "user-service=false" >> $GITHUB_OUTPUT
          fi
          
          if echo "$CHANGED_FILES" | grep -q "^restaurant-service/"; then
            echo "✅ restaurant-service has changes"
            echo "restaurant-service=true" >> $GITHUB_OUTPUT
          else
            echo "⏭️ restaurant-service unchanged"
            echo "restaurant-service=false" >> $GITHUB_OUTPUT
          fi
          
          if echo "$CHANGED_FILES" | grep -q "^order-service/"; then
            echo "✅ order-service has changes"
            echo "order-service=true" >> $GITHUB_OUTPUT
          else
            echo "⏭️ order-service unchanged"
            echo "order-service=false" >> $GITHUB_OUTPUT
          fi
          
          if echo "$CHANGED_FILES" | grep -q "^payment-service/"; then
            echo "✅ payment-service has changes"
            echo "payment-service=true" >> $GITHUB_OUTPUT
          else
            echo "⏭️ payment-service unchanged"
            echo "payment-service=false" >> $GITHUB_OUTPUT
          fi
          
          if echo "$CHANGED_FILES" | grep -q "^api-gateway/"; then
            echo "✅ api-gateway has changes"
            echo "api-gateway=true" >> $GITHUB_OUTPUT
          else
            echo "⏭️ api-gateway unchanged"
            echo "api-gateway=false" >> $GITHUB_OUTPUT
          fi
          
          if echo "$CHANGED_FILES" | grep -q "^frontend/"; then
            echo "✅ frontend has changes"
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "⏭️ frontend unchanged"
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push User Service
        if: needs.detect-changes.outputs.user-service == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cnpm-food-user-service:latest
            ${{ secrets.DOCKER_USERNAME }}/cnpm-food-user-service:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/cnpm-food-user-service:latest
          cache-to: type=inline

      - name: Build and Push Restaurant Service
        if: needs.detect-changes.outputs.restaurant-service == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./restaurant-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cnpm-food-restaurant-service:latest
            ${{ secrets.DOCKER_USERNAME }}/cnpm-food-restaurant-service:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/cnpm-food-restaurant-service:latest
          cache-to: type=inline

      - name: Build and Push Order Service
        if: needs.detect-changes.outputs.order-service == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cnpm-food-order-service:latest
            ${{ secrets.DOCKER_USERNAME }}/cnpm-food-order-service:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/cnpm-food-order-service:latest
          cache-to: type=inline

      - name: Build and Push Payment Service
        if: needs.detect-changes.outputs.payment-service == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./payment-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cnpm-food-payment-service:latest
            ${{ secrets.DOCKER_USERNAME }}/cnpm-food-payment-service:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/cnpm-food-payment-service:latest
          cache-to: type=inline

      - name: Build and Push API Gateway
        if: needs.detect-changes.outputs.api-gateway == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cnpm-food-api-gateway:latest
            ${{ secrets.DOCKER_USERNAME }}/cnpm-food-api-gateway:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/cnpm-food-api-gateway:latest
          cache-to: type=inline

      - name: Build and Push Frontend
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cnpm-food-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/cnpm-food-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/cnpm-food-frontend:latest
          cache-to: type=inline

      - name: Summary
        if: always()
        run: |
          echo "## 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services Built and Pushed:" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.detect-changes.outputs.user-service }}" == "true" ]; then
            echo "✅ **user-service** - Built and pushed to Docker Hub" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ **user-service** - No changes, skipped" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.detect-changes.outputs.restaurant-service }}" == "true" ]; then
            echo "✅ **restaurant-service** - Built and pushed to Docker Hub" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ **restaurant-service** - No changes, skipped" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.detect-changes.outputs.order-service }}" == "true" ]; then
            echo "✅ **order-service** - Built and pushed to Docker Hub" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ **order-service** - No changes, skipped" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.detect-changes.outputs.payment-service }}" == "true" ]; then
            echo "✅ **payment-service** - Built and pushed to Docker Hub" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ **payment-service** - No changes, skipped" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.detect-changes.outputs.api-gateway }}" == "true" ]; then
            echo "✅ **api-gateway** - Built and pushed to Docker Hub" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ **api-gateway** - No changes, skipped" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.detect-changes.outputs.frontend }}" == "true" ]; then
            echo "✅ **frontend** - Built and pushed to Docker Hub" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ **frontend** - No changes, skipped" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to [Render Dashboard](https://dashboard.render.com)" >> $GITHUB_STEP_SUMMARY
          echo "2. Services will auto-detect new images and redeploy" >> $GITHUB_STEP_SUMMARY
          echo "3. Or manually trigger: **Settings → Manual Deploy → Clear build cache & deploy**" >> $GITHUB_STEP_SUMMARY
