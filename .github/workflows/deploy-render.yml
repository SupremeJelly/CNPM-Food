name: Deploy to Render

on:
  push:
    # branches: [main, src]
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: render-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
#   DOCKER_USERNAME: jelly1810
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========== STAGE 1: TEST (Parallel) ==========
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user-service, order-service, restaurant-service, payment-service, api-gateway]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run tests for ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: mvn clean verify -B

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/target/surefire-reports/
            ${{ matrix.service }}/target/failsafe-reports/
          retention-days: 7

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm run test:ci
        continue-on-error: true

      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-frontend
          path: frontend/coverage/
          retention-days: 7

  # ========== STAGE 2: BUILD & PUSH DOCKER IMAGES ==========
  build-and-push:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/src')
    strategy:
      matrix:
        service:
          - name: frontend
            path: ./frontend
          - name: api-gateway
            path: ./api-gateway
          - name: user-service
            path: ./user-service
          - name: restaurant-service
            path: ./restaurant-service
          - name: order-service
            path: ./order-service
          - name: payment-service
            path: ./payment-service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and Push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.path }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service.name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service.name }}:latest
          cache-to: type=inline

  # ========== STAGE 3: DEPLOY TO RENDER ==========
  deploy-to-render:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/src')
    strategy:
      matrix:
        service:
          - name: user-service
            render_service_id: ${{ secrets.RENDER_USER_SERVICE_ID }}
          - name: restaurant-service
            render_service_id: ${{ secrets.RENDER_RESTAURANT_SERVICE_ID }}
          - name: order-service
            render_service_id: ${{ secrets.RENDER_ORDER_SERVICE_ID }}
          - name: payment-service
            render_service_id: ${{ secrets.RENDER_PAYMENT_SERVICE_ID }}
          - name: api-gateway
            render_service_id: ${{ secrets.RENDER_API_GATEWAY_ID }}
          - name: frontend
            render_service_id: ${{ secrets.RENDER_FRONTEND_ID }}
    
    steps:
      - name: Trigger Render Deploy for ${{ matrix.service.name }}
        run: |
          echo "Deploying ${{ matrix.service.name }} to Render..."
          response=$(curl -s -w "\n%{http_code}" -X POST \
            https://api.render.com/v1/services/${{ matrix.service.render_service_id }}/deploys \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "clear"}')
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Deploy triggered successfully for ${{ matrix.service.name }}"
            echo "$body"
          else
            echo "❌ Deploy failed for ${{ matrix.service.name }} (HTTP $http_code)"
            echo "$body"
            exit 1
          fi

  # ========== STAGE 4: TEST SUMMARY ==========
  test-summary:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: test-results/

      - name: Generate test summary
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          for dir in test-results/*/; do
            if [ -d "$dir" ]; then
              SERVICE=$(basename "$dir")
              echo "### $SERVICE" >> $GITHUB_STEP_SUMMARY
              
              if [ -f "$dir"/*.xml ]; then
                TESTS=$(grep -r "tests=" "$dir" | awk -F'"' '{sum += $2} END {print sum}' || echo "N/A")
                FAILURES=$(grep -r "failures=" "$dir" | awk -F'"' '{sum += $2} END {print sum}' || echo "0")
                echo "- Tests: $TESTS" >> $GITHUB_STEP_SUMMARY
                echo "- Failures: $FAILURES" >> $GITHUB_STEP_SUMMARY
              else
                echo "- No test results found" >> $GITHUB_STEP_SUMMARY
              fi
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done
