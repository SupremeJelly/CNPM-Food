name: Integrated CI/CD Pipeline

on:
  push:
    branches: [ main, src ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  NAMESPACE: cnpm-food

jobs:
  # ========== STAGE 1: TEST (Parallel) ==========
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user-service, order-service, restaurant-service, payment-service, api-gateway]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run tests for ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: |
          echo "JOB_START: test-backend-${{ matrix.service }}"
          echo "STEP_START: Run tests for ${{ matrix.service }}"
          
          # Run unit tests and integration tests
          if mvn clean verify -B 2>&1 | tee test-output.log; then
            echo "STEP_STATUS: PASS"
            TEST_EXIT=0
          else
            echo "STEP_STATUS: FAIL"
            TEST_EXIT=1
          fi
          
          # Parse test results from surefire/failsafe reports
          TOTAL=0
          FAILURES=0
          ERRORS=0
          
          for REPORT_DIR in target/surefire-reports target/failsafe-reports; do
            if [ -d "$REPORT_DIR" ]; then
              for XML in $REPORT_DIR/TEST-*.xml; do
                if [ -f "$XML" ]; then
                  T=$(grep -oP 'tests="\K[0-9]+' "$XML" | head -1 || echo 0)
                  F=$(grep -oP 'failures="\K[0-9]+' "$XML" | head -1 || echo 0)
                  E=$(grep -oP 'errors="\K[0-9]+' "$XML" | head -1 || echo 0)
                  TOTAL=$((TOTAL + T))
                  FAILURES=$((FAILURES + F))
                  ERRORS=$((ERRORS + E))
                  
                  # Extract failed test names
                  grep -oP '<testcase.*name="\K[^"]+' "$XML" | while read TEST_NAME; do
                    if grep -A 5 "name=\"$TEST_NAME\"" "$XML" | grep -q '<failure\|<error'; then
                      echo "TEST_RUN: $TEST_NAME"
                      echo "TEST_STATUS: FAIL"
                      ERROR_MSG=$(grep -A 5 "name=\"$TEST_NAME\"" "$XML" | grep -oP 'message="\K[^"]+' | head -1 || echo "Test failed")
                      echo "TEST_ERROR: $ERROR_MSG"
                    fi
                  done
                fi
              done
            fi
          done
          
          PASSED=$((TOTAL - FAILURES - ERRORS))
          echo "TEST_SUMMARY: Total=$TOTAL Passed=$PASSED Failed=$((FAILURES + ERRORS))"
          
          exit $TEST_EXIT

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/target/surefire-reports/
            ${{ matrix.service }}/target/failsafe-reports/
          retention-days: 7

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true

      - name: Run frontend tests
        working-directory: ./frontend
        run: |
          echo "JOB_START: test-frontend"
          echo "STEP_START: Run frontend tests"
          if npm run test:ci; then
            echo "STEP_STATUS: PASS"
          else
            echo "STEP_STATUS: FAIL"
          fi
        continue-on-error: true

      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-frontend
          path: frontend/coverage/
          retention-days: 7

  # ========== STAGE 2: CODE QUALITY (After Tests) ==========
  # code-quality:
  #   needs: [test-backend, test-frontend]
  #   runs-on: ubuntu-latest
    
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4

  #     - name: Set up JDK 21
  #       uses: actions/setup-java@v4
  #       with:
  #         distribution: 'temurin'
  #         java-version: '21'

  #     - name: OWASP Dependency Check (Backend)
  #       run: |
  #         for service in user-service order-service restaurant-service payment-service api-gateway; do
  #           echo "Checking $service..."
  #           cd $service
  #           mvn org.owasp:dependency-check-maven:check || true
  #           cd ..
  #         done
  #       continue-on-error: true

  #     - name: Set up Node.js for frontend audit
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: '20'
  #         cache: 'npm'
  #         cache-dependency-path: frontend/package-lock.json

  #     - name: Frontend security audit
  #       working-directory: ./frontend
  #       run: npm audit --production || true
  #       continue-on-error: true

  # ========== STAGE 3: BUILD ARTIFACTS (After Quality Checks) ==========
  build-artifacts:
    needs: test-backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build all backend services (skip tests - already ran)
        run: |
          echo "JOB_START: build-artifacts"
          for service in user-service order-service restaurant-service payment-service api-gateway; do
            echo "STEP_START: Build $service"
            cd $service
            if mvn clean package -DskipTests -B; then
              echo "STEP_STATUS: PASS"
            else
              echo "STEP_STATUS: FAIL"
              cd ..
              exit 1
            fi
            cd ..
          done

      - name: Upload backend JARs
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: |
            user-service/target/*.jar
            order-service/target/*.jar
            restaurant-service/target/*.jar
            payment-service/target/*.jar
            api-gateway/target/*.jar
          retention-days: 30

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 30

  # ========== STAGE 4: BUILD & PUSH DOCKER IMAGES (Only on main/src branch) ==========
  build-images:
    needs: build-artifacts
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/src')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          ref: ${{ github.ref }}

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: ./

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Detect changed paths
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff-tree --no-commit-id --name-only -r HEAD)
          else
            CHANGED="all"
          fi
          
          echo "Changed files:"
          echo "$CHANGED"
          
          # Check if only workflow/k8s files changed (no code changes)
          WORKFLOW_ONLY="false"
          if echo "$CHANGED" | grep -qE '^\.github/|^k8s/'; then
            if ! echo "$CHANGED" | grep -qE '\.(java|xml|properties|ts|js|html|css|scss|json|Dockerfile)'; then
              WORKFLOW_ONLY="true"
              echo "Only workflow/k8s files changed - will skip image build but allow deploy"
            fi
          fi
          
          echo "workflow_only=$WORKFLOW_ONLY" >> $GITHUB_OUTPUT
          
          # Determine which services changed (ignore docs/workflows)
          if [ "$CHANGED" == "all" ]; then
            echo "user=true" >> $GITHUB_OUTPUT
            echo "order=true" >> $GITHUB_OUTPUT
            echo "restaurant=true" >> $GITHUB_OUTPUT
            echo "payment=true" >> $GITHUB_OUTPUT
            echo "gateway=true" >> $GITHUB_OUTPUT
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            # Check each service (only if source code changed, not docs)
            if echo "$CHANGED" | grep -qE 'user-service/.*\.(java|xml|properties|Dockerfile)'; then
              echo "user=true" >> $GITHUB_OUTPUT
            else
              echo "user=false" >> $GITHUB_OUTPUT
            fi
            
            if echo "$CHANGED" | grep -qE 'order-service/.*\.(java|xml|properties|Dockerfile)'; then
              echo "order=true" >> $GITHUB_OUTPUT
            else
              echo "order=false" >> $GITHUB_OUTPUT
            fi
            
            if echo "$CHANGED" | grep -qE 'restaurant-service/.*\.(java|xml|properties|Dockerfile)'; then
              echo "restaurant=true" >> $GITHUB_OUTPUT
            else
              echo "restaurant=false" >> $GITHUB_OUTPUT
            fi
            
            if echo "$CHANGED" | grep -qE 'payment-service/.*\.(java|xml|properties|Dockerfile)'; then
              echo "payment=true" >> $GITHUB_OUTPUT
            else
              echo "payment=false" >> $GITHUB_OUTPUT
            fi
            
            if echo "$CHANGED" | grep -qE 'api-gateway/.*\.(java|xml|properties|Dockerfile)'; then
              echo "gateway=true" >> $GITHUB_OUTPUT
            else
              echo "gateway=false" >> $GITHUB_OUTPUT
            fi
            
            if echo "$CHANGED" | grep -qE 'frontend/.*\.(ts|js|html|css|scss|json|Dockerfile)'; then
              echo "frontend=true" >> $GITHUB_OUTPUT
            else
              echo "frontend=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Build and Push user-service
        if: steps.changes.outputs.user == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: true
          tags: |
            onlykohi/cnpm-user-service:latest
            onlykohi/cnpm-user-service:${{ github.sha }}
          cache-from: type=registry,ref=onlykohi/cnpm-user-service:latest
          cache-to: type=inline

      - name: Build and Push order-service
        if: steps.changes.outputs.order == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          push: true
          tags: |
            onlykohi/cnpm-order-service:latest
            onlykohi/cnpm-order-service:${{ github.sha }}
          cache-from: type=registry,ref=onlykohi/cnpm-order-service:latest
          cache-to: type=inline

      - name: Build and Push restaurant-service
        if: steps.changes.outputs.restaurant == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./restaurant-service
          push: true
          tags: |
            onlykohi/cnpm-restaurant-service:latest
            onlykohi/cnpm-restaurant-service:${{ github.sha }}
          cache-from: type=registry,ref=onlykohi/cnpm-restaurant-service:latest
          cache-to: type=inline

      - name: Build and Push payment-service
        if: steps.changes.outputs.payment == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./payment-service
          push: true
          tags: |
            onlykohi/cnpm-payment-service:latest
            onlykohi/cnpm-payment-service:${{ github.sha }}
          cache-from: type=registry,ref=onlykohi/cnpm-payment-service:latest
          cache-to: type=inline

      - name: Build and Push API Gateway
        if: steps.changes.outputs.gateway == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: |
            onlykohi/cnpm-api-gateway:latest
            onlykohi/cnpm-api-gateway:${{ github.sha }}
          cache-from: type=registry,ref=onlykohi/cnpm-api-gateway:latest
          cache-to: type=inline

      - name: Build and Push frontend
        if: steps.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            onlykohi/cnpm-frontend:latest
            onlykohi/cnpm-frontend:${{ github.sha }}
          cache-from: type=registry,ref=onlykohi/cnpm-frontend:latest
          cache-to: type=inline

  # ========== STAGE 5: DEPLOY TO KUBERNETES (Only after successful image build) ==========
  # TEMPORARILY DISABLED - Change "if: false" to original condition to re-enable
  deploy-to-k8s:
    needs: build-images
    runs-on: self-hosted
    environment: staging
    if: false
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          ref: ${{ github.ref }}

      - name: Detect changed paths
        id: changes
        shell: powershell
        run: |
          # Get changed files
          $CHANGED = ""
          if ("${{ github.event_name }}" -eq "push") {
            try {
              $CHANGED = git diff --name-only HEAD~1 HEAD 2>$null
            } catch {
              $CHANGED = git diff-tree --no-commit-id --name-only -r HEAD
            }
          } else {
            $CHANGED = "all"
          }

          Write-Host "Changed files:"
          Write-Host $CHANGED

          # Check if only workflow/k8s files changed (no code changes)
          $WORKFLOW_ONLY = $false
          if ($CHANGED -match '\.github/|k8s/') {
            if ($CHANGED -notmatch '\.(java|xml|properties|ts|js|html|css|scss|json|Dockerfile)') {
              $WORKFLOW_ONLY = $true
              Write-Host "Only workflow/k8s files changed - will use existing images with :latest tag"
              # Set all services to true to trigger redeploy with existing images
              Add-Content -Path $env:GITHUB_OUTPUT -Value "user=true"
              Add-Content -Path $env:GITHUB_OUTPUT -Value "order=true"
              Add-Content -Path $env:GITHUB_OUTPUT -Value "restaurant=true"
              Add-Content -Path $env:GITHUB_OUTPUT -Value "payment=true"
              Add-Content -Path $env:GITHUB_OUTPUT -Value "gateway=true"
              Add-Content -Path $env:GITHUB_OUTPUT -Value "frontend=true"
              Add-Content -Path $env:GITHUB_OUTPUT -Value "mysql=false"
              Add-Content -Path $env:GITHUB_OUTPUT -Value "k8s=true"
              Add-Content -Path $env:GITHUB_OUTPUT -Value "workflow_only=true"
              return
            }
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "workflow_only=false"

          # Determine which services changed (ignore docs/workflows)
          if ($CHANGED -eq "all") {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "user=true"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "order=true"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "restaurant=true"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "payment=true"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "gateway=true"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "frontend=true"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "mysql=true"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "k8s=true"
          } else {
            # Check each service (only source code changes)
            if ($CHANGED -match 'user-service/.*\.(java|xml|properties|Dockerfile)') {
              Add-Content -Path $env:GITHUB_OUTPUT -Value "user=true"
            } else {
              Add-Content -Path $env:GITHUB_OUTPUT -Value "user=false"
            }
            
            if ($CHANGED -match 'order-service/.*\.(java|xml|properties|Dockerfile)') {
              Add-Content -Path $env:GITHUB_OUTPUT -Value "order=true"
            } else {
              Add-Content -Path $env:GITHUB_OUTPUT -Value "order=false"
            }
            
            if ($CHANGED -match 'restaurant-service/.*\.(java|xml|properties|Dockerfile)') {
              Add-Content -Path $env:GITHUB_OUTPUT -Value "restaurant=true"
            } else {
              Add-Content -Path $env:GITHUB_OUTPUT -Value "restaurant=false"
            }
            
            if ($CHANGED -match 'payment-service/.*\.(java|xml|properties|Dockerfile)') {
              Add-Content -Path $env:GITHUB_OUTPUT -Value "payment=true"
            } else {
              Add-Content -Path $env:GITHUB_OUTPUT -Value "payment=false"
            }
            
            if ($CHANGED -match 'api-gateway/.*\.(java|xml|properties|Dockerfile)') {
              Add-Content -Path $env:GITHUB_OUTPUT -Value "gateway=true"
            } else {
              Add-Content -Path $env:GITHUB_OUTPUT -Value "gateway=false"
            }
            
            if ($CHANGED -match 'frontend/.*\.(ts|js|html|css|scss|json|Dockerfile)') {
              Add-Content -Path $env:GITHUB_OUTPUT -Value "frontend=true"
            } else {
              Add-Content -Path $env:GITHUB_OUTPUT -Value "frontend=false"
            }
            
            if ($CHANGED -match 'mysql-init/') {
              Add-Content -Path $env:GITHUB_OUTPUT -Value "mysql=true"
            } else {
              Add-Content -Path $env:GITHUB_OUTPUT -Value "mysql=false"
            }
            
            if ($CHANGED -match 'k8s/') {
              Add-Content -Path $env:GITHUB_OUTPUT -Value "k8s=true"
            } else {
              Add-Content -Path $env:GITHUB_OUTPUT -Value "k8s=false"
            }
          }

      - name: Login to DockerHub (for pulling images)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Set up kubectl (using Docker Desktop's default kubeconfig)
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify kubectl connection
        shell: powershell
        run: |
          Write-Host "Checking kubectl connection..."
          
          # Retry kubectl commands up to 3 times with 30-second delays
          $maxRetries = 3
          $retryCount = 0
          $success = $false
          
          while ($retryCount -lt $maxRetries -and -not $success) {
            try {
              Write-Host "Attempt $($retryCount + 1) of $maxRetries..."
              
              kubectl version --client=true
              if ($LASTEXITCODE -ne 0) { throw "kubectl version failed" }
              
              kubectl config current-context
              if ($LASTEXITCODE -ne 0) { throw "kubectl config failed" }
              
              kubectl cluster-info
              if ($LASTEXITCODE -ne 0) { throw "kubectl cluster-info failed" }
              
              kubectl get nodes
              if ($LASTEXITCODE -ne 0) { throw "kubectl get nodes failed" }
              
              $success = $true
              Write-Host "kubectl connection verified successfully."
            } catch {
              Write-Host "Attempt $($retryCount + 1) failed: $_"
              $retryCount++
              if ($retryCount -lt $maxRetries) {
                Write-Host "Waiting 30 seconds before retry..."
                Start-Sleep -Seconds 30
              }
            }
          }
          
          if (-not $success) {
            Write-Host "Failed to connect to kubectl after $maxRetries attempts. Please ensure Docker Desktop is running and Kubernetes is enabled."
            exit 1
          }

      - name: Prepare MySQL Deployment
        shell: powershell
        run: |
          # Namespaces
          kubectl create namespace $env:NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -

          $mysqlChanged = "${{ steps.changes.outputs.mysql }}" -eq "true"
          $mysqlExists = (kubectl get deploy/mysql -n $env:NAMESPACE --ignore-not-found | Select-String 'mysql')
          if ($mysqlExists -and -not $mysqlChanged) {
            Write-Host 'MySQL already exists and init.sql unchanged – skipping redeploy.'
          } else {
            Write-Host 'Applying (or reapplying) MySQL resources.'
            kubectl create configmap mysql-init-script -n $env:NAMESPACE --from-file=init.sql=mysql-init/init.sql --dry-run=client -o yaml | kubectl apply -f -
            kubectl apply -n $env:NAMESPACE -f k8s/services/mysql-deployment.yaml
            Write-Host 'Waiting for MySQL to be ready...'
            kubectl wait --for=condition=ready pod -l app=mysql -n $env:NAMESPACE --timeout=300s
          }

      # Note: Monitoring deployment removed from CI.
      # Monitoring manifests are intentionally not applied by this pipeline. Monitoring (Prometheus/Grafana/Loki)
      # should be installed and managed separately (manually or via a dedicated infrastructure pipeline).
      # If you need to apply monitoring manifests manually, run locally or in a dedicated job:
      #   kubectl apply -n monitoring -f k8s/monitoring

      - name: Deploy Microservices (backends first, gateway last)
        shell: powershell
        run: |
          Write-Host "Applying backend deployments first..."
          $backendFiles = @(
            "user-service-deployment.yaml",
            "restaurant-service-deployment.yaml",
            "order-service-deployment.yaml",
            "payment-service-deployment.yaml"
          )
          foreach ($f in $backendFiles) {
            $full = "k8s/services/" + $f
            Write-Host "Applying $full"
            kubectl apply -n $env:NAMESPACE -f $full
          }

          Write-Host "Apply API gateway and frontend (last)..."
          kubectl apply -n $env:NAMESPACE -f k8s/services/api-gateway-deployment.yaml
          kubectl apply -n $env:NAMESPACE -f k8s/services/frontend-deployment.yaml

          # Ensure api-gateway exposes Prometheus endpoint and is annotated for scraping
          kubectl set env deployment/api-gateway MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus -n $env:NAMESPACE
          if ($LASTEXITCODE -ne 0) { Write-Host 'set env failed or already set' }
          kubectl annotate deployment api-gateway prometheus.io/scrape="true" prometheus.io/path="/actuator/prometheus" prometheus.io/port="9000" -n $env:NAMESPACE --overwrite
          if ($LASTEXITCODE -ne 0) { Write-Host 'annotate failed' }

          Write-Host "Delete pods for changed services before updating images (non-destructive)"
          if ("${{ steps.changes.outputs.user }}" -eq "true") { kubectl delete pod -l app=user-service -n $env:NAMESPACE --ignore-not-found }
          if ("${{ steps.changes.outputs.restaurant }}" -eq "true") { kubectl delete pod -l app=restaurant-service -n $env:NAMESPACE --ignore-not-found }
          if ("${{ steps.changes.outputs.order }}" -eq "true") { kubectl delete pod -l app=order-service -n $env:NAMESPACE --ignore-not-found }
          if ("${{ steps.changes.outputs.payment }}" -eq "true") { kubectl delete pod -l app=payment-service -n $env:NAMESPACE --ignore-not-found }
          if ("${{ steps.changes.outputs.gateway }}" -eq "true") { kubectl delete pod -l app=api-gateway -n $env:NAMESPACE --ignore-not-found }

          # Determine which image tag to use
          $imageTag = "${{ github.sha }}"
          if ("${{ steps.changes.outputs.workflow_only }}" -eq "true") {
            $imageTag = "latest"
            Write-Host "Using :latest tag (workflow/k8s only changes, no new images built)"
          } else {
            Write-Host "Using :$imageTag tag (new images were built)"
          }

          Write-Host "Updating images to $imageTag for changed services..."
          if ("${{ steps.changes.outputs.user }}" -eq "true") { kubectl set image deployment/user-service user-service=onlykohi/cnpm-user-service:$imageTag -n $env:NAMESPACE }
          if ("${{ steps.changes.outputs.restaurant }}" -eq "true") { kubectl set image deployment/restaurant-service restaurant-service=onlykohi/cnpm-restaurant-service:$imageTag -n $env:NAMESPACE }
          if ("${{ steps.changes.outputs.order }}" -eq "true") { kubectl set image deployment/order-service order-service=onlykohi/cnpm-order-service:$imageTag -n $env:NAMESPACE }
          if ("${{ steps.changes.outputs.payment }}" -eq "true") { kubectl set image deployment/payment-service payment-service=onlykohi/cnpm-payment-service:$imageTag -n $env:NAMESPACE }
          if ("${{ steps.changes.outputs.gateway }}" -eq "true") { kubectl set image deployment/api-gateway api-gateway=onlykohi/cnpm-api-gateway:$imageTag -n $env:NAMESPACE }
          if ("${{ steps.changes.outputs.frontend }}" -eq "true") { kubectl set image deployment/frontend frontend=onlykohi/cnpm-frontend:$imageTag -n $env:NAMESPACE }

      - name: Wait for deployments to be ready
        shell: powershell
        run: |
          Write-Host "Waiting for changed services to be ready..."
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $failed = @()
          $checkDeploys = @()
          if ("${{ steps.changes.outputs.user }}" -eq "true" -or "${{ steps.changes.outputs.k8s }}" -eq "true") { $checkDeploys += 'user-service' }
          if ("${{ steps.changes.outputs.restaurant }}" -eq "true" -or "${{ steps.changes.outputs.k8s }}" -eq "true") { $checkDeploys += 'restaurant-service' }
          if ("${{ steps.changes.outputs.order }}" -eq "true" -or "${{ steps.changes.outputs.k8s }}" -eq "true") { $checkDeploys += 'order-service' }
          if ("${{ steps.changes.outputs.payment }}" -eq "true" -or "${{ steps.changes.outputs.k8s }}" -eq "true") { $checkDeploys += 'payment-service' }
          if ("${{ steps.changes.outputs.gateway }}" -eq "true" -or "${{ steps.changes.outputs.k8s }}" -eq "true") { $checkDeploys += 'api-gateway' }
          if ("${{ steps.changes.outputs.frontend }}" -eq "true" -or "${{ steps.changes.outputs.k8s }}" -eq "true") { $checkDeploys += 'frontend' }
          if ($checkDeploys.Count -eq 0) { Write-Host 'No deployments changed, skipping rollout check.'; return }
          foreach ($d in $checkDeploys) {
            kubectl rollout status deployment/$d -n $env:NAMESPACE --timeout=5m
            if ($LASTEXITCODE -ne 0) {
              "Deployment $d failed" | Tee-Object -FilePath artifacts/rollout_failures.txt -Append | Out-Null
              $failed += $d
            }
          }
          if ($failed.Count -gt 0) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("Failed: " + ($failed -join ' '))
          }

      - name: Apply Ingress
        shell: powershell
        run: |
          if (Test-Path "k8s/ingress.yaml") { kubectl apply -f k8s/ingress.yaml }
        continue-on-error: true

      - name: Deployment Summary
        shell: powershell
        run: |
          $summary = @()
          $summary += "## Deployment Complete"
          $summary += ""
          $summary += "### Pods"
          $summary += (kubectl get pods -n $env:NAMESPACE)
          $summary += ""
          if (Test-Path artifacts/rollout_failures.txt) { $summary += "### Failed"; $summary += (Get-Content artifacts/rollout_failures.txt) }
          ($summary -join "`n") | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload diagnostics artifact (only on failures)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: k8s-diagnostics
          path: artifacts
          if-no-files-found: ignore

  # ========== STAGE 6: EXPORT LOGS TO LOKI ==========
  export-logs-to-loki:
    needs: [test-backend, test-frontend, build-artifacts, build-images]
    runs-on: ubuntu-latest
    if: always()
    environment: staging
    
    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: test-results/
        continue-on-error: true

      - name: Push logs to Loki
        env:
          LOKI_URL: ${{ secrets.LOKI_URL }}
          LOKI_USER: ${{ secrets.LOKI_USER }}
          LOKI_PASSWORD: ${{ secrets.LOKI_PASSWORD }}
        run: |
          # Debug: Check if secrets are set
          echo "Checking Loki configuration..."
          if [ -z "$LOKI_URL" ]; then
            echo "⚠️ LOKI_URL is not set. Please add it to GitHub repository secrets."
            echo "Skipping log export."
            exit 0
          fi
          if [ -z "$LOKI_USER" ]; then
            echo "⚠️ LOKI_USER is not set. Using no authentication."
          fi
          echo "✅ LOKI_URL is configured: ${LOKI_URL:0:30}..."
          
          TS=$(date +%s)000000000
          LOGS=""
          
          # Helper function to add log entry
          add_log() {
            if [ -z "$LOGS" ]; then
              LOGS="[\"$TS\",\"$1\"]"
            else
              LOGS="$LOGS,[\"$TS\",\"$1\"]"
            fi
          }
          
          # Initial workflow info
          add_log "workflow=${{ github.workflow }} run=${{ github.run_id }} branch=${{ github.ref_name }}"
          
          # Job status summary
          echo "=== Job Status Summary ==="
          TOTAL_JOBS=0
          PASSED_JOBS=0
          FAILED_JOBS=0
          
          # Check each job status (deploy-to-k8s temporarily excluded)
          for job_name in "test-backend" "test-frontend" "build-artifacts" "build-images"; do
            TOTAL_JOBS=$((TOTAL_JOBS + 1))
            case "$job_name" in
              "test-backend")
                STATUS="${{ needs.test-backend.result }}"
                ;;
              "test-frontend")
                STATUS="${{ needs.test-frontend.result }}"
                ;;
              "build-artifacts")
                STATUS="${{ needs.build-artifacts.result }}"
                ;;
              "build-images")
                STATUS="${{ needs.build-images.result }}"
                ;;
            esac
            
            if [ "$STATUS" = "success" ]; then
              PASSED_JOBS=$((PASSED_JOBS + 1))
              add_log "job_status job=$job_name status=pass"
            elif [ "$STATUS" = "failure" ]; then
              FAILED_JOBS=$((FAILED_JOBS + 1))
              add_log "job_status job=$job_name status=fail"
            elif [ "$STATUS" = "skipped" ]; then
              add_log "job_status job=$job_name status=skipped"
            fi
          done
          
          # Add job summary log
          add_log "job_summary total=$TOTAL_JOBS passed=$PASSED_JOBS failed=$FAILED_JOBS"
          echo "Jobs: Total=$TOTAL_JOBS Passed=$PASSED_JOBS Failed=$FAILED_JOBS"
          
          # Test results summary
          echo "=== Test Results Summary ==="
          TOTAL_TESTS=0
          PASSED_TESTS=0
          FAILED_TESTS=0
          
          if [ -d "test-results" ]; then
            for dir in test-results/*/; do
              [ -d "$dir" ] || continue
              SERVICE=$(basename "$dir")
              
              # Aggregate tests per service
              SVC_TESTS=0
              SVC_FAILURES=0
              SVC_ERRORS=0
              
              for XML in "$dir"/*.xml "$dir"/**/*.xml; do
                [ -f "$XML" ] || continue
                T=$(grep -oP 'tests="\K[0-9]+' "$XML" | head -1 || echo "0")
                F=$(grep -oP 'failures="\K[0-9]+' "$XML" | head -1 || echo "0")
                E=$(grep -oP 'errors="\K[0-9]+' "$XML" | head -1 || echo "0")
                
                SVC_TESTS=$((SVC_TESTS + T))
                SVC_FAILURES=$((SVC_FAILURES + F))
                SVC_ERRORS=$((SVC_ERRORS + E))
                
                # Extract failed test names with service context
                if [ "$F" -gt 0 ] || [ "$E" -gt 0 ]; then
                  grep -oP '<testcase.*?name="\K[^"]+' "$XML" 2>/dev/null | while read TEST; do
                    if grep -A 3 "name=\"$TEST\"" "$XML" | grep -q '<failure\|<error'; then
                      ERR=$(grep -A 3 "name=\"$TEST\"" "$XML" | grep -oP 'message="\K[^"]+' | head -1 | cut -c1-80)
                      add_log "test_failed service=$SERVICE test=$TEST error=${ERR:-Unknown}"
                    fi
                  done
                fi
              done
              
              SVC_PASSED=$((SVC_TESTS - SVC_FAILURES - SVC_ERRORS))
              TOTAL_TESTS=$((TOTAL_TESTS + SVC_TESTS))
              PASSED_TESTS=$((PASSED_TESTS + SVC_PASSED))
              FAILED_TESTS=$((FAILED_TESTS + SVC_FAILURES + SVC_ERRORS))
              
              # Log per-service test summary
              if [ "$SVC_TESTS" -gt 0 ]; then
                add_log "test_summary service=$SERVICE total=$SVC_TESTS passed=$SVC_PASSED failed=$((SVC_FAILURES + SVC_ERRORS))"
                echo "Service: $SERVICE - Total=$SVC_TESTS Passed=$SVC_PASSED Failed=$((SVC_FAILURES + SVC_ERRORS))"
              fi
            done
          fi
          
          # Add overall test summary
          if [ "$TOTAL_TESTS" -gt 0 ]; then
            add_log "test_summary_total total=$TOTAL_TESTS passed=$PASSED_TESTS failed=$FAILED_TESTS"
            echo "Tests Overall: Total=$TOTAL_TESTS Passed=$PASSED_TESTS Failed=$FAILED_TESTS"
          fi
          
          # Wrap logs in array brackets
          LOGS="[$LOGS]"
          
          PAYLOAD="{\"streams\":[{\"stream\":{\"wflog\":\"github-actions\",\"job\":\"ci\",\"workflow\":\"${{ github.workflow }}\",\"run_id\":\"${{ github.run_id }}\"},\"values\":$LOGS}]}"
          
          curl -s -X POST "$LOKI_URL" \
            -u "$LOKI_USER:$LOKI_PASSWORD" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" && echo "✅ Logs pushed to Loki successfully" || echo "❌ Failed to push logs"

  # ========== STAGE 7: TEST SUMMARY (Always runs) ==========
  test-summary:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: test-results/

      - name: Generate test summary
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          for dir in test-results/*/; do
            if [ -d "$dir" ]; then
              SERVICE=$(basename "$dir")
              echo "### $SERVICE" >> $GITHUB_STEP_SUMMARY
              
              # Check if XML files exist
              XML_COUNT=$(find "$dir" -name "*.xml" -type f 2>/dev/null | wc -l)
              if [ "$XML_COUNT" -gt 0 ]; then
                TESTS=$(grep -rh 'tests=' "$dir" 2>/dev/null | grep -oP 'tests="\K[0-9]+' | awk '{sum += $1} END {print (NR>0 ? sum : 0)}')
                FAILURES=$(grep -rh 'failures=' "$dir" 2>/dev/null | grep -oP 'failures="\K[0-9]+' | awk '{sum += $1} END {print (NR>0 ? sum : 0)}')
                ERRORS=$(grep -rh 'errors=' "$dir" 2>/dev/null | grep -oP 'errors="\K[0-9]+' | awk '{sum += $1} END {print (NR>0 ? sum : 0)}')
                PASSED=$((TESTS - FAILURES - ERRORS))
                
                echo "- ✅ Passed: $PASSED" >> $GITHUB_STEP_SUMMARY
                echo "- ❌ Failed: $FAILURES" >> $GITHUB_STEP_SUMMARY
                echo "- ⚠️ Errors: $ERRORS" >> $GITHUB_STEP_SUMMARY
                echo "- 📊 Total: $TESTS" >> $GITHUB_STEP_SUMMARY
                
                # Show failed tests (only if there are failures)
                if [ "$FAILURES" -gt 0 ] || [ "$ERRORS" -gt 0 ]; then
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "#### ❌ Failed Tests:" >> $GITHUB_STEP_SUMMARY
                  for XML in "$dir"/*.xml "$dir"/**/*.xml; do
                    [ -f "$XML" ] || continue
                    grep -oP '<testcase.*?name="\K[^"]+' "$XML" 2>/dev/null | while read TEST; do
                      if grep -A 3 "name=\"$TEST\"" "$XML" | grep -q '<failure\|<error'; then
                        echo "- \`$TEST\`" >> $GITHUB_STEP_SUMMARY
                      fi
                    done
                  done
                fi
              else
                echo "- No test results found" >> $GITHUB_STEP_SUMMARY
              fi
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done