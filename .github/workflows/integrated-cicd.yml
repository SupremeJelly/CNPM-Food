name: Integrated CI/CD Pipeline

on:
  push:
    branches: [ main, src ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  NAMESPACE: cnpm-food

jobs:
  # ========== STAGE 1: TEST (Parallel) ==========
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user-service, order-service, restaurant-service, payment-service, api-gateway]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run tests for ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: mvn clean test -B

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          retention-days: 7

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm run test:ci
        continue-on-error: true

      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-frontend
          path: frontend/coverage/
          retention-days: 7

  # ========== STAGE 2: CODE QUALITY (After Tests) ==========
  # code-quality:
  #   needs: [test-backend, test-frontend]
  #   runs-on: ubuntu-latest
    
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4

  #     - name: Set up JDK 21
  #       uses: actions/setup-java@v4
  #       with:
  #         distribution: 'temurin'
  #         java-version: '21'

  #     - name: OWASP Dependency Check (Backend)
  #       run: |
  #         for service in user-service order-service restaurant-service payment-service api-gateway; do
  #           echo "Checking $service..."
  #           cd $service
  #           mvn org.owasp:dependency-check-maven:check || true
  #           cd ..
  #         done
  #       continue-on-error: true

  #     - name: Set up Node.js for frontend audit
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: '20'
  #         cache: 'npm'
  #         cache-dependency-path: frontend/package-lock.json

  #     - name: Frontend security audit
  #       working-directory: ./frontend
  #       run: npm audit --production || true
  #       continue-on-error: true

  # ========== STAGE 3: BUILD ARTIFACTS (After Quality Checks) ==========
  build-artifacts:
    needs: test-backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build all backend services (skip tests - already ran)
        run: |
          for service in user-service order-service restaurant-service payment-service api-gateway; do
            echo "Building $service..."
            cd $service
            mvn clean package -DskipTests -B
            cd ..
          done

      - name: Upload backend JARs
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: |
            user-service/target/*.jar
            order-service/target/*.jar
            restaurant-service/target/*.jar
            payment-service/target/*.jar
            api-gateway/target/*.jar
          retention-days: 30

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 30

  # ========== STAGE 4: BUILD & PUSH DOCKER IMAGES (Only on main/src branch) ==========
  build-images:
    needs: build-artifacts
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/src')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: ./

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Detect changed paths
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff-tree --no-commit-id --name-only -r HEAD)
          else
            CHANGED="all"
          fi
          
          # Filter out documentation and workflow files, keep only source code
          if [ "$CHANGED" != "all" ]; then
            FILTERED=$(echo "$CHANGED" | grep -E '\.(java|ts|js|html|css|scss|json|xml|yml|yaml|properties|sql|Dockerfile)$|^(src/|frontend/|user-service/|order-service/|restaurant-service/|payment-service/|api-gateway/|mysql-init/|k8s/)' | grep -v -E '\.github/|\.md$|\.txt$' || echo "")
            CHANGED="$FILTERED"
          fi
          
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed files:"
          echo "$CHANGED"
          echo "$CHANGED"

      - name: Build and Push user-service
        if: contains(steps.changes.outputs.changed, 'user-service/') || contains(steps.changes.outputs.changed, 'all')
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: true
          tags: |
            onlykohi/cnpm-user-service:latest
            onlykohi/cnpm-user-service:${{ github.sha }}
          cache-from: type=registry,ref=onlykohi/cnpm-user-service:latest
          cache-to: type=inline

      - name: Build and Push order-service
        if: contains(steps.changes.outputs.changed, 'order-service/') || contains(steps.changes.outputs.changed, 'all')
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          push: true
          tags: |
            onlykohi/cnpm-order-service:latest
            onlykohi/cnpm-order-service:${{ github.sha }}
          cache-from: type=registry,ref=onlykohi/cnpm-order-service:latest
          cache-to: type=inline

      - name: Build and Push restaurant-service
        if: contains(steps.changes.outputs.changed, 'restaurant-service/') || contains(steps.changes.outputs.changed, 'all')
        uses: docker/build-push-action@v5
        with:
          context: ./restaurant-service
          push: true
          tags: |
            onlykohi/cnpm-restaurant-service:latest
            onlykohi/cnpm-restaurant-service:${{ github.sha }}
          cache-from: type=registry,ref=onlykohi/cnpm-restaurant-service:latest
          cache-to: type=inline

      - name: Build and Push payment-service
        if: contains(steps.changes.outputs.changed, 'payment-service/') || contains(steps.changes.outputs.changed, 'all')
        uses: docker/build-push-action@v5
        with:
          context: ./payment-service
          push: true
          tags: |
            onlykohi/cnpm-payment-service:latest
            onlykohi/cnpm-payment-service:${{ github.sha }}
          cache-from: type=registry,ref=onlykohi/cnpm-payment-service:latest
          cache-to: type=inline

      - name: Build and Push API Gateway
        if: contains(steps.changes.outputs.changed, 'api-gateway/') || contains(steps.changes.outputs.changed, 'all')
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: |
            onlykohi/cnpm-api-gateway:latest
            onlykohi/cnpm-api-gateway:${{ github.sha }}
          cache-from: type=registry,ref=onlykohi/cnpm-api-gateway:latest
          cache-to: type=inline

      - name: Build and Push frontend
        if: contains(steps.changes.outputs.changed, 'frontend/') || contains(steps.changes.outputs.changed, 'all')
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            onlykohi/cnpm-frontend:latest
            onlykohi/cnpm-frontend:${{ github.sha }}
          cache-from: type=registry,ref=onlykohi/cnpm-frontend:latest
          cache-to: type=inline

  # ========== STAGE 5: DEPLOY TO KUBERNETES (Only after successful image build) ==========
  deploy-to-k8s:
    needs: build-images
    runs-on: self-hosted
    environment: staging
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        shell: powershell
        run: |
          # Get changed files
          $CHANGED_FILES = ""
          if ("${{ github.event_name }}" -eq "push") {
            try {
              $CHANGED_FILES = git diff --name-only HEAD~1 HEAD 2>$null
            } catch {
              $CHANGED_FILES = git diff-tree --no-commit-id --name-only -r HEAD
            }
          } else {
            $CHANGED_FILES = "all"
          }

          # Filter out documentation and workflow files, keep only source code
          if ($CHANGED_FILES -ne "all") {
            $FILTERED = $CHANGED_FILES | Where-Object {
              $_ -match '\.(java|ts|js|html|css|scss|json|xml|yml|yaml|properties|sql|Dockerfile)$' -or
              $_ -match '^(src/|frontend/|user-service/|order-service/|restaurant-service/|payment-service/|api-gateway/|mysql-init/|k8s/)' -and
              $_ -notmatch '\.github/' -and
              $_ -notmatch '\.md$' -and
              $_ -notmatch '\.txt$'
            }
            $CHANGED_FILES = ($FILTERED -join "`n").Trim()
            if (-not $CHANGED_FILES) { $CHANGED_FILES = "" }
          }

          # Clean up and join with spaces
          $CHANGED_CLEAN = ($CHANGED_FILES -split "`n" | Where-Object { $_ -ne "" }) -join " "

          Write-Host "Changed files:"
          Write-Host $CHANGED_FILES
          Write-Host "Filtered: $CHANGED_CLEAN"

          # Set outputs
          echo "CHANGED_PATHS=$CHANGED_CLEAN" >> $env:GITHUB_ENV
          echo "changed=$CHANGED_CLEAN" >> $GITHUB_OUTPUT

      - name: Login to DockerHub (for pulling images)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Set up kubectl (using Docker Desktop's default kubeconfig)
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify kubectl connection
        shell: powershell
        run: |
          Write-Host "Checking kubectl connection..."
          kubectl version --client=true
          kubectl config current-context
          kubectl cluster-info
          kubectl get nodes

      - name: Prepare MySQL Deployment
        shell: powershell
        env:
          CHANGED_PATHS: ${{ steps.changes.outputs.changed }}
        run: |
          # Namespaces
          kubectl create namespace $env:NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -

          $initChanged = $false
          if ($env:CHANGED_PATHS -and $env:CHANGED_PATHS.Contains('mysql-init/')) { $initChanged = $true }
          $mysqlExists = (kubectl get deploy/mysql -n $env:NAMESPACE --ignore-not-found | Select-String 'mysql')
          if ($mysqlExists -and -not $initChanged) {
            Write-Host 'MySQL already exists and init.sql unchanged – skipping redeploy.'
          } else {
            Write-Host 'Applying (or reapplying) MySQL resources.'
            kubectl create configmap mysql-init-script -n $env:NAMESPACE --from-file=init.sql=mysql-init/init.sql --dry-run=client -o yaml | kubectl apply -f -
            kubectl apply -n $env:NAMESPACE -f k8s/services/mysql-deployment.yaml
            Write-Host 'Waiting for MySQL to be ready...'
            kubectl wait --for=condition=ready pod -l app=mysql -n $env:NAMESPACE --timeout=300s
          }

      - name: Deploy Monitoring manifests
        shell: powershell
        env:
          CHANGED_PATHS: ${{ steps.changes.outputs.changed }}
        run: |
          Write-Host "Preparing monitoring deployment..."
          # Ensure monitoring namespace exists (created earlier in Prepare MySQL step)
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -

          if (Test-Path "k8s/monitoring") {
            Write-Host "Deleting old monitoring pods (if any) in namespace 'monitoring'..."
            kubectl delete pod -n monitoring --all --ignore-not-found

            # If a Prometheus manifest is present, deploy it first so Grafana datasource has a target
            if (Test-Path "k8s/monitoring/prometheus-deployment.yaml") {
              Write-Host "Found Prometheus manifest; applying prometheus first..."
              kubectl apply -n monitoring -f k8s/monitoring/prometheus-deployment.yaml
              Write-Host "Waiting up to 120s for Prometheus pod to become ready..."
              kubectl wait --for=condition=ready pod -l app=prometheus -n monitoring --timeout=120s
              if ($LASTEXITCODE -ne 0) { Write-Host "Prometheus did not become ready within timeout" }
            }

            Write-Host "Applying monitoring manifests from k8s/monitoring..."
              kubectl apply -n monitoring -f k8s/monitoring
              # Ensure monitoring deployments pick up any ConfigMap changes
              kubectl rollout restart deployment prometheus -n monitoring
              if ($LASTEXITCODE -ne 0) { Write-Host 'prometheus restart failed' }
              kubectl rollout restart deployment grafana -n monitoring
              if ($LASTEXITCODE -ne 0) { Write-Host 'grafana restart failed' }
          } else {
            Write-Host "No monitoring manifests found at k8s/monitoring; skipping monitoring deploy."
          }

      - name: Deploy Microservices (backends first, gateway last)
        shell: powershell
        env:
          CHANGED_PATHS: ${{ steps.changes.outputs.changed }}
        run: |
          Write-Host "Applying backend deployments first..."
          $backendFiles = @(
            "user-service-deployment.yaml",
            "restaurant-service-deployment.yaml",
            "order-service-deployment.yaml",
            "payment-service-deployment.yaml"
          )
          foreach ($f in $backendFiles) {
            $full = "k8s/services/" + $f
            Write-Host "Applying $full"
            kubectl apply -n $env:NAMESPACE -f $full
          }

          Write-Host "Apply API gateway and frontend (last)..."
          kubectl apply -n $env:NAMESPACE -f k8s/services/api-gateway-deployment.yaml
          kubectl apply -n $env:NAMESPACE -f k8s/services/frontend-deployment.yaml

          # Ensure api-gateway exposes Prometheus endpoint and is annotated for scraping
          kubectl set env deployment/api-gateway MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus -n $env:NAMESPACE
          if ($LASTEXITCODE -ne 0) { Write-Host 'set env failed or already set' }
          kubectl annotate deployment api-gateway prometheus.io/scrape="true" prometheus.io/path="/actuator/prometheus" prometheus.io/port="9000" -n $env:NAMESPACE --overwrite
          if ($LASTEXITCODE -ne 0) { Write-Host 'annotate failed' }

          Write-Host "Delete pods for changed services before updating images (non-destructive)"
          if ($env:CHANGED_PATHS -and $env:CHANGED_PATHS.Contains('user-service/')) { kubectl delete pod -l app=user-service -n $env:NAMESPACE --ignore-not-found }
          if ($env:CHANGED_PATHS -and $env:CHANGED_PATHS.Contains('restaurant-service/')) { kubectl delete pod -l app=restaurant-service -n $env:NAMESPACE --ignore-not-found }
          if ($env:CHANGED_PATHS -and $env:CHANGED_PATHS.Contains('order-service/')) { kubectl delete pod -l app=order-service -n $env:NAMESPACE --ignore-not-found }
          if ($env:CHANGED_PATHS -and $env:CHANGED_PATHS.Contains('payment-service/')) { kubectl delete pod -l app=payment-service -n $env:NAMESPACE --ignore-not-found }
          if ($env:CHANGED_PATHS -and $env:CHANGED_PATHS.Contains('api-gateway/')) { kubectl delete pod -l app=api-gateway -n $env:NAMESPACE --ignore-not-found }

          Write-Host "Updating images to commit SHA only for changed services..."
          if ($env:CHANGED_PATHS -and $env:CHANGED_PATHS.Contains('user-service/')) { kubectl set image deployment/user-service user-service=onlykohi/cnpm-user-service:${{ github.sha }} -n $env:NAMESPACE }
          if ($env:CHANGED_PATHS -and $env:CHANGED_PATHS.Contains('restaurant-service/')) { kubectl set image deployment/restaurant-service restaurant-service=onlykohi/cnpm-restaurant-service:${{ github.sha }} -n $env:NAMESPACE }
          if ($env:CHANGED_PATHS -and $env:CHANGED_PATHS.Contains('order-service/')) { kubectl set image deployment/order-service order-service=onlykohi/cnpm-order-service:${{ github.sha }} -n $env:NAMESPACE }
          if ($env:CHANGED_PATHS -and $env:CHANGED_PATHS.Contains('payment-service/')) { kubectl set image deployment/payment-service payment-service=onlykohi/cnpm-payment-service:${{ github.sha }} -n $env:NAMESPACE }
          if ($env:CHANGED_PATHS -and $env:CHANGED_PATHS.Contains('api-gateway/')) { kubectl set image deployment/api-gateway api-gateway=onlykohi/cnpm-api-gateway:${{ github.sha }} -n $env:NAMESPACE }
          if ($env:CHANGED_PATHS -and $env:CHANGED_PATHS.Contains('frontend/')) { kubectl set image deployment/frontend frontend=onlykohi/cnpm-frontend:${{ github.sha }} -n $env:NAMESPACE }

      - name: Wait for deployments to be ready
        shell: powershell
        env:
          CHANGED_PATHS: ${{ steps.changes.outputs.changed }}
        run: |
          Write-Host "Waiting for changed services to be ready..."
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $failed = @()
          $checkDeploys = @()
          if ($env:CHANGED_PATHS -and ($env:CHANGED_PATHS.Contains('user-service/') -or $env:CHANGED_PATHS.Contains('k8s/'))) { $checkDeploys += 'user-service' }
          if ($env:CHANGED_PATHS -and ($env:CHANGED_PATHS.Contains('restaurant-service/') -or $env:CHANGED_PATHS.Contains('k8s/'))) { $checkDeploys += 'restaurant-service' }
          if ($env:CHANGED_PATHS -and ($env:CHANGED_PATHS.Contains('order-service/') -or $env:CHANGED_PATHS.Contains('k8s/'))) { $checkDeploys += 'order-service' }
          if ($env:CHANGED_PATHS -and ($env:CHANGED_PATHS.Contains('payment-service/') -or $env:CHANGED_PATHS.Contains('k8s/'))) { $checkDeploys += 'payment-service' }
          if ($env:CHANGED_PATHS -and ($env:CHANGED_PATHS.Contains('api-gateway/') -or $env:CHANGED_PATHS.Contains('k8s/'))) { $checkDeploys += 'api-gateway' }
          if ($env:CHANGED_PATHS -and ($env:CHANGED_PATHS.Contains('frontend/') -or $env:CHANGED_PATHS.Contains('k8s/'))) { $checkDeploys += 'frontend' }
          if ($checkDeploys.Count -eq 0) { Write-Host 'No deployments changed, skipping rollout check.'; return }
          foreach ($d in $checkDeploys) {
            kubectl rollout status deployment/$d -n $env:NAMESPACE --timeout=5m
            if ($LASTEXITCODE -ne 0) {
              "Deployment $d failed" | Tee-Object -FilePath artifacts/rollout_failures.txt -Append | Out-Null
              $failed += $d
            }
          }
          if ($failed.Count -gt 0) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("Failed: " + ($failed -join ' '))
          }

      - name: Apply Ingress
        shell: powershell
        run: |
          if (Test-Path "k8s/ingress.yaml") { kubectl apply -f k8s/ingress.yaml }
        continue-on-error: true

      - name: Deployment Summary
        shell: powershell
        run: |
          $summary = @()
          $summary += "## Deployment Complete"
          $summary += ""
          $summary += "### Pods"
          $summary += (kubectl get pods -n $env:NAMESPACE)
          $summary += ""
          if (Test-Path artifacts/rollout_failures.txt) { $summary += "### Failed"; $summary += (Get-Content artifacts/rollout_failures.txt) }
          ($summary -join "`n") | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload diagnostics artifact (only on failures)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: k8s-diagnostics
          path: artifacts
          if-no-files-found: ignore

  # ========== STAGE 6: TEST SUMMARY (Always runs) ==========
  test-summary:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: test-results/

      - name: Generate test summary
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          for dir in test-results/*/; do
            if [ -d "$dir" ]; then
              SERVICE=$(basename "$dir")
              echo "### $SERVICE" >> $GITHUB_STEP_SUMMARY
              
              if [ -f "$dir"/*.xml ]; then
                TESTS=$(grep -r "tests=" "$dir" | head -1 | sed 's/.*tests="\([0-9]*\)".*/\1/' || echo "N/A")
                FAILURES=$(grep -r "failures=" "$dir" | head -1 | sed 's/.*failures="\([0-9]*\)".*/\1/' || echo "0")
                echo "- Tests: $TESTS" >> $GITHUB_STEP_SUMMARY
                echo "- Failures: $FAILURES" >> $GITHUB_STEP_SUMMARY
              else
                echo "- No test results found" >> $GITHUB_STEP_SUMMARY
              fi
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done