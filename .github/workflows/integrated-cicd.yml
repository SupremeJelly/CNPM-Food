name: Integrated CI/CD Pipeline

on:
  push:
    branches: [ main, src ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  NAMESPACE: cnpm-food

jobs:
  # ========== STAGE 1: TEST (Parallel) ==========
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user-service, order-service, restaurant-service, payment-service, api-gateway]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run tests for ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: mvn clean test -B

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          retention-days: 7

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm run test:ci
        continue-on-error: true

      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-frontend
          path: frontend/coverage/
          retention-days: 7

  # ========== STAGE 2: CODE QUALITY (After Tests) ==========
  code-quality:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: OWASP Dependency Check (Backend)
        run: |
          for service in user-service order-service restaurant-service payment-service api-gateway; do
            echo "Checking $service..."
            cd $service
            mvn org.owasp:dependency-check-maven:check || true
            cd ..
          done
        continue-on-error: true

      - name: Set up Node.js for frontend audit
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend security audit
        working-directory: ./frontend
        run: npm audit --production || true
        continue-on-error: true

  # ========== STAGE 3: BUILD ARTIFACTS (After Quality Checks) ==========
  build-artifacts:
    needs: code-quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build all backend services (skip tests - already ran)
        run: |
          for service in user-service order-service restaurant-service payment-service api-gateway; do
            echo "Building $service..."
            cd $service
            mvn clean package -DskipTests -B
            cd ..
          done

      - name: Upload backend JARs
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: |
            user-service/target/*.jar
            order-service/target/*.jar
            restaurant-service/target/*.jar
            payment-service/target/*.jar
            api-gateway/target/*.jar
          retention-days: 30

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 30

  # ========== STAGE 4: BUILD & PUSH DOCKER IMAGES (Only on main/src branch) ==========
  build-images:
    needs: build-artifacts
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/src')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: ./

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Detect changed paths
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff-tree --no-commit-id --name-only -r HEAD)
          else
            CHANGED="all"
          fi
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed files:"
          echo "$CHANGED"

      - name: Build and Push user-service
        if: contains(steps.changes.outputs.changed, 'user-service/') || contains(steps.changes.outputs.changed, 'all')
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: true
          tags: |
            onlykohi/cnpm-user-service:latest
            onlykohi/cnpm-user-service:${{ github.sha }}
          cache-from: type=registry,ref=onlykohi/cnpm-user-service:latest
          cache-to: type=inline

      - name: Build and Push order-service
        if: contains(steps.changes.outputs.changed, 'order-service/') || contains(steps.changes.outputs.changed, 'all')
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          push: true
          tags: |
            onlykohi/cnpm-order-service:latest
            onlykohi/cnpm-order-service:${{ github.sha }}
          cache-from: type=registry,ref=onlykohi/cnpm-order-service:latest
          cache-to: type=inline

      - name: Build and Push restaurant-service
        if: contains(steps.changes.outputs.changed, 'restaurant-service/') || contains(steps.changes.outputs.changed, 'all')
        uses: docker/build-push-action@v5
        with:
          context: ./restaurant-service
          push: true
          tags: |
            onlykohi/cnpm-restaurant-service:latest
            onlykohi/cnpm-restaurant-service:${{ github.sha }}
          cache-from: type=registry,ref=onlykohi/cnpm-restaurant-service:latest
          cache-to: type=inline

      - name: Build and Push payment-service
        if: contains(steps.changes.outputs.changed, 'payment-service/') || contains(steps.changes.outputs.changed, 'all')
        uses: docker/build-push-action@v5
        with:
          context: ./payment-service
          push: true
          tags: |
            onlykohi/cnpm-payment-service:latest
            onlykohi/cnpm-payment-service:${{ github.sha }}
          cache-from: type=registry,ref=onlykohi/cnpm-payment-service:latest
          cache-to: type=inline

      - name: Build and Push API Gateway
        if: contains(steps.changes.outputs.changed, 'api-gateway/') || contains(steps.changes.outputs.changed, 'all')
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: |
            onlykohi/cnpm-api-gateway:latest
            onlykohi/cnpm-api-gateway:${{ github.sha }}
          cache-from: type=registry,ref=onlykohi/cnpm-api-gateway:latest
          cache-to: type=inline

      - name: Build and Push frontend
        if: contains(steps.changes.outputs.changed, 'frontend/') || contains(steps.changes.outputs.changed, 'all')
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            onlykohi/cnpm-frontend:latest
            onlykohi/cnpm-frontend:${{ github.sha }}
          cache-from: type=registry,ref=onlykohi/cnpm-frontend:latest
          cache-to: type=inline

  # ========== STAGE 5: DEPLOY TO KUBERNETES (Only after successful image build) ==========
  deploy:
    needs: build-images
    runs-on: ubuntu-latest
    environment: staging
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/src')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p $HOME/.kube
          if [ -n "$KUBE_CONFIG_DATA" ]; then
            echo "$KUBE_CONFIG_DATA" | base64 -d > $HOME/.kube/config
          else
            echo "Warning: KUBE_CONFIG_DATA not set, using existing kubeconfig"
          fi
          kubectl version --client=true
          kubectl config current-context
          kubectl cluster-info

      - name: Create namespaces
        run: |
          kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -

      - name: Detect changed paths
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff-tree --no-commit-id --name-only -r HEAD)
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT

      - name: Deploy MySQL (if needed)
        run: |
          MYSQL_EXISTS=$(kubectl get deploy/mysql -n $NAMESPACE --ignore-not-found)
          if [ -z "$MYSQL_EXISTS" ] || echo "${{ steps.changes.outputs.changed }}" | grep -q "mysql-init/"; then
            echo "Deploying MySQL..."
            kubectl create configmap mysql-init-script -n $NAMESPACE \
              --from-file=init.sql=mysql-init/init.sql \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl apply -n $NAMESPACE -f k8s/services/mysql-deployment.yaml
            kubectl wait --for=condition=ready pod -l app=mysql -n $NAMESPACE --timeout=300s
          else
            echo "MySQL already running and init.sql unchanged - skipping"
          fi

      - name: Deploy backend services
        run: |
          kubectl apply -n $NAMESPACE -f k8s/services/user-service-deployment.yaml
          kubectl apply -n $NAMESPACE -f k8s/services/restaurant-service-deployment.yaml
          kubectl apply -n $NAMESPACE -f k8s/services/order-service-deployment.yaml
          kubectl apply -n $NAMESPACE -f k8s/services/payment-service-deployment.yaml

      - name: Deploy API Gateway and Frontend
        run: |
          kubectl apply -n $NAMESPACE -f k8s/services/api-gateway-deployment.yaml
          kubectl apply -n $NAMESPACE -f k8s/services/frontend-deployment.yaml

      - name: Update images to commit SHA
        run: |
          CHANGED="${{ steps.changes.outputs.changed }}"
          if echo "$CHANGED" | grep -q "user-service/"; then
            kubectl set image deployment/user-service user-service=onlykohi/cnpm-user-service:${{ github.sha }} -n $NAMESPACE
          fi
          if echo "$CHANGED" | grep -q "restaurant-service/"; then
            kubectl set image deployment/restaurant-service restaurant-service=onlykohi/cnpm-restaurant-service:${{ github.sha }} -n $NAMESPACE
          fi
          if echo "$CHANGED" | grep -q "order-service/"; then
            kubectl set image deployment/order-service order-service=onlykohi/cnpm-order-service:${{ github.sha }} -n $NAMESPACE
          fi
          if echo "$CHANGED" | grep -q "payment-service/"; then
            kubectl set image deployment/payment-service payment-service=onlykohi/cnpm-payment-service:${{ github.sha }} -n $NAMESPACE
          fi
          if echo "$CHANGED" | grep -q "api-gateway/"; then
            kubectl set image deployment/api-gateway api-gateway=onlykohi/cnpm-api-gateway:${{ github.sha }} -n $NAMESPACE
          fi
          if echo "$CHANGED" | grep -q "frontend/"; then
            kubectl set image deployment/frontend frontend=onlykohi/cnpm-frontend:${{ github.sha }} -n $NAMESPACE
          fi

      - name: Wait for rollout completion
        run: |
          CHANGED="${{ steps.changes.outputs.changed }}"
          FAILED=""
          
          if echo "$CHANGED" | grep -q "user-service/\|k8s/"; then
            kubectl rollout status deployment/user-service -n $NAMESPACE --timeout=5m || FAILED="$FAILED user-service"
          fi
          if echo "$CHANGED" | grep -q "restaurant-service/\|k8s/"; then
            kubectl rollout status deployment/restaurant-service -n $NAMESPACE --timeout=5m || FAILED="$FAILED restaurant-service"
          fi
          if echo "$CHANGED" | grep -q "order-service/\|k8s/"; then
            kubectl rollout status deployment/order-service -n $NAMESPACE --timeout=5m || FAILED="$FAILED order-service"
          fi
          if echo "$CHANGED" | grep -q "payment-service/\|k8s/"; then
            kubectl rollout status deployment/payment-service -n $NAMESPACE --timeout=5m || FAILED="$FAILED payment-service"
          fi
          if echo "$CHANGED" | grep -q "api-gateway/\|k8s/"; then
            kubectl rollout status deployment/api-gateway -n $NAMESPACE --timeout=5m || FAILED="$FAILED api-gateway"
          fi
          if echo "$CHANGED" | grep -q "frontend/\|k8s/"; then
            kubectl rollout status deployment/frontend -n $NAMESPACE --timeout=5m || FAILED="$FAILED frontend"
          fi
          
          if [ -n "$FAILED" ]; then
            echo "❌ Failed deployments: $FAILED" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Deploy monitoring stack
        run: |
          kubectl apply -f k8s/monitoring/prometheus-deployment.yaml
          kubectl apply -f k8s/monitoring/grafana-deployment.yaml
          kubectl wait --for=condition=ready pod -l app=prometheus -n monitoring --timeout=300s || true
          kubectl wait --for=condition=ready pod -l app=grafana -n monitoring --timeout=300s || true

      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pods Status" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n $NAMESPACE >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get svc -n $NAMESPACE >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload diagnostics on failure
        if: failure()
        run: |
          mkdir -p diagnostics
          kubectl get pods -n $NAMESPACE -o yaml > diagnostics/pods.yaml
          kubectl describe pods -n $NAMESPACE > diagnostics/pods-describe.txt
          kubectl logs -l app=user-service -n $NAMESPACE --tail=100 > diagnostics/user-service.log || true
          kubectl logs -l app=order-service -n $NAMESPACE --tail=100 > diagnostics/order-service.log || true
          kubectl logs -l app=restaurant-service -n $NAMESPACE --tail=100 > diagnostics/restaurant-service.log || true
          kubectl logs -l app=payment-service -n $NAMESPACE --tail=100 > diagnostics/payment-service.log || true
          kubectl logs -l app=api-gateway -n $NAMESPACE --tail=100 > diagnostics/api-gateway.log || true

      - name: Upload diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: k8s-diagnostics-${{ github.sha }}
          path: diagnostics/
          retention-days: 7

  # ========== STAGE 6: TEST SUMMARY (Always runs) ==========
  test-summary:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: test-results/

      - name: Generate test summary
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          for dir in test-results/*/; do
            if [ -d "$dir" ]; then
              SERVICE=$(basename "$dir")
              echo "### $SERVICE" >> $GITHUB_STEP_SUMMARY
              
              if [ -f "$dir"/*.xml ]; then
                TESTS=$(grep -r "tests=" "$dir" | head -1 | sed 's/.*tests="\([0-9]*\)".*/\1/' || echo "N/A")
                FAILURES=$(grep -r "failures=" "$dir" | head -1 | sed 's/.*failures="\([0-9]*\)".*/\1/' || echo "0")
                echo "- Tests: $TESTS" >> $GITHUB_STEP_SUMMARY
                echo "- Failures: $FAILURES" >> $GITHUB_STEP_SUMMARY
              else
                echo "- No test results found" >> $GITHUB_STEP_SUMMARY
              fi
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done
