name: Test Monitoring

on:
  workflow_dispatch:
  push:
    branches: [src]
    paths:
      - '.github/workflows/test-monitoring.yml'

jobs:
  test-success:
    runs-on: ubuntu-latest
    steps:
      - name: Success step
        run: echo "This step passes"
      
      - name: Run some tests
        run: |
          echo "Running test suite..."
          echo "Test 1: PASSED"
          echo "Test 2: PASSED"
          echo "All tests passed!"

  test-with-failure:
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        run: echo "Setting up test environment"
      
      - name: Run failing tests
        run: |
          echo "===== TEST EXECUTION START ====="
          echo "TEST_SUITE: Integration Tests"
          echo "TEST_TOTAL: 5"
          echo ""
          echo "TEST_RUN: test_user_authentication"
          echo "TEST_STATUS: PASS"
          echo ""
          echo "TEST_RUN: test_database_connection"
          echo "TEST_STATUS: PASS"
          echo ""
          echo "TEST_RUN: test_api_endpoint_validation"
          echo "TEST_STATUS: FAIL"
          echo "TEST_ERROR: Expected status 200 but got 500"
          echo ""
          echo "TEST_RUN: test_payment_processing"
          echo "TEST_STATUS: PASS"
          echo ""
          echo "TEST_RUN: test_order_workflow"
          echo "TEST_STATUS: FAIL"
          echo "TEST_ERROR: OrderNotFoundException: Order ID 12345 not found"
          echo ""
          echo "===== TEST SUMMARY ====="
          echo "TEST_PASSED: 3"
          echo "TEST_FAILED: 2"
          echo "TEST_SKIPPED: 0"
          exit 1
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration
          path: |
            echo "<testsuite tests=\"5\" failures=\"2\" errors=\"0\">" > test-results.xml
            echo "  <testcase name=\"test_user_authentication\" />" >> test-results.xml
            echo "  <testcase name=\"test_database_connection\" />" >> test-results.xml
            echo "  <testcase name=\"test_api_endpoint_validation\"><failure message=\"Expected status 200 but got 500\" /></testcase>" >> test-results.xml
            echo "  <testcase name=\"test_payment_processing\" />" >> test-results.xml
            echo "  <testcase name=\"test_order_workflow\"><failure message=\"OrderNotFoundException: Order ID 12345 not found\" /></testcase>" >> test-results.xml
            echo "</testsuite>" >> test-results.xml
      
      - name: Cleanup
        if: always()
        run: echo "Cleanup completed"

  test-java-style-failure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Run Maven Tests
        run: |
          mkdir -p target/surefire-reports
          
          # Create XML test results
          cat > target/surefire-reports/TEST-UserServiceTest.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite tests="3" failures="1" errors="0" name="com.cnpmfood.user.UserServiceTest">
            <testcase name="testUserRegistration" classname="com.cnpmfood.user.UserServiceTest">
              <failure message="Expected user to be created but got null" type="AssertionError">AssertionError: Expected user to be created but got null</failure>
            </testcase>
            <testcase name="testUserLogin" classname="com.cnpmfood.user.UserServiceTest"/>
            <testcase name="testUserUpdate" classname="com.cnpmfood.user.UserServiceTest"/>
          </testsuite>
          EOF
          
          cat > target/surefire-reports/TEST-OrderServiceTest.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite tests="1" failures="0" errors="1" name="com.cnpmfood.order.OrderServiceTest">
            <testcase name="testOrderCreation" classname="com.cnpmfood.order.OrderServiceTest">
              <error message="NullPointerException at OrderService.createOrder" type="NullPointerException">NullPointerException at OrderService.createOrder(OrderService.java:45)</error>
            </testcase>
          </testsuite>
          EOF
          
          cat > target/surefire-reports/TEST-OtherTests.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite tests="3" failures="1" errors="0" name="Other Tests">
            <testcase name="testRestaurantSearch" classname="com.cnpmfood.restaurant.RestaurantServiceTest"/>
            <testcase name="testPaymentProcessing" classname="com.cnpmfood.payment.PaymentServiceTest">
              <failure message="Timeout: Payment gateway did not respond within 5000ms" type="TimeoutException">Timeout: Payment gateway did not respond within 5000ms</failure>
            </testcase>
          </testsuite>
          EOF
          
          echo "===== MAVEN TEST EXECUTION ====="
          echo "TEST_SUITE: UserService Tests"
          echo "TEST_TOTAL: 8"
          echo ""
          echo "TEST_RUN: testUserRegistration"
          echo "TEST_CLASS: com.cnpmfood.user.UserServiceTest"
          echo "TEST_STATUS: FAIL"
          echo "TEST_ERROR: AssertionError: Expected user to be created but got null"
          echo ""
          echo "TEST_RUN: testUserLogin"
          echo "TEST_CLASS: com.cnpmfood.user.UserServiceTest"
          echo "TEST_STATUS: PASS"
          echo ""
          echo "TEST_RUN: testUserUpdate"
          echo "TEST_CLASS: com.cnpmfood.user.UserServiceTest"
          echo "TEST_STATUS: PASS"
          echo ""
          echo "TEST_RUN: testOrderCreation"
          echo "TEST_CLASS: com.cnpmfood.order.OrderServiceTest"
          echo "TEST_STATUS: ERROR"
          echo "TEST_ERROR: NullPointerException at OrderService.createOrder(OrderService.java:45)"
          echo ""
          echo "TEST_RUN: testRestaurantSearch"
          echo "TEST_CLASS: com.cnpmfood.restaurant.RestaurantServiceTest"
          echo "TEST_STATUS: PASS"
          echo ""
          echo "TEST_RUN: testPaymentProcessing"
          echo "TEST_CLASS: com.cnpmfood.payment.PaymentServiceTest"
          echo "TEST_STATUS: FAIL"
          echo "TEST_ERROR: Timeout: Payment gateway did not respond within 5000ms"
          echo ""
          echo "===== TEST SUMMARY ====="
          echo "TEST_PASSED: 3"
          echo "TEST_FAILED: 3"
          echo "TEST_ERRORS: 2"
          echo "TEST_SKIPPED: 0"
          echo "[ERROR] BUILD FAILURE"
          exit 1
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-backend
          path: target/surefire-reports/*.xml
