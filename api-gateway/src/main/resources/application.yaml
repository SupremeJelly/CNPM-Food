spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 10000  # 10 seconds
        response-timeout: 30s   # 30 seconds
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: 
              - "http://localhost:4200"
              - "http://localhost:32000"
              - "http://localhost:32085"
            allowedMethods:
              - "GET"
              - "POST"
              - "PUT"
              - "DELETE"
              - "OPTIONS"
              - "PATCH"
            allowedHeaders:
              - "Authorization"
              - "Content-Type"
              - "Accept"
              - "Origin"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: restaurant-service
          uri: ${RESTAURANT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/restaurants/**, /api/v1/menu-items/**
          filters:
            - name: CircuitBreaker
              args:
                name: restaurantCircuitBreaker
                fallbackUri: forward:/fallback/restaurant
            # - name: RequestRateLimiter
            #   args:
            #     redis-rate-limiter.replenishRate: 10
            #     redis-rate-limiter.burstCapacity: 50
            #     redis-rate-limiter.requestedTokens: 1

        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderCircuitBreaker
                fallbackUri: forward:/fallback/order
            # - name: RequestRateLimiter
            #   args:
            #     redis-rate-limiter.replenishRate: 10
            #     redis-rate-limiter.burstCapacity: 50
            #     redis-rate-limiter.requestedTokens: 1

        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**, /api/v1/auth/**
          filters:
            # - RemoveRequestHeader=Cookie
            - name: CircuitBreaker
              args:
                name: userCircuitBreaker
                fallbackUri: forward:/fallback/user
            # - name: RequestRateLimiter
            #   args:
            #     redis-rate-limiter.replenishRate: 10
            #     redis-rate-limiter.burstCapacity: 50
            #     redis-rate-limiter.requestedTokens: 1

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: paymentCircuitBreaker
                fallbackUri: forward:/fallback/payment
            # - name: RequestRateLimiter
            #   args:
            #     redis-rate-limiter.replenishRate: 10
            #     redis-rate-limiter.burstCapacity: 50
            #     redis-rate-limiter.requestedTokens: 1

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
    instances:
      restaurantCircuitBreaker:
        baseConfig: default
      orderCircuitBreaker:
        baseConfig: default
      userCircuitBreaker:
        baseConfig: default
      paymentCircuitBreaker:       # 👉 thêm circuit breaker cho payment
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 30s  # Tăng timeout lên 30 giây
    instances:
      restaurantCircuitBreaker:
        baseConfig: default
      orderCircuitBreaker:
        baseConfig: default
      userCircuitBreaker:
        baseConfig: default
      paymentCircuitBreaker:
        baseConfig: default

server:
  port: 9000

# eureka
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true

# Management endpoint exposure for monitoring
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
