server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    
    # CRITICAL: Include MIME types để serve JS/CSS với đúng Content-Type
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    
    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/x-javascript image/svg+xml;
    
    # Angular routing: fallback to index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Cache static files (JS/CSS/images)
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Don't fallback to index.html for missing assets
        try_files $uri =404;
    }
    
    # Disable caching for index.html to ensure users get latest version
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }
}
