<div class="container mx-auto">
  <!-- Header -->
  <div class="mb-6">
    <h1 class="text-3xl font-bold text-gray-800 mb-2">
      <i class="fas fa-users mr-2"></i> User Management
    </h1>
    <p class="text-gray-600">Manage all registered users in the system</p>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="flex justify-center items-center py-12">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
  </div>

  <!-- Error State -->
  <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
    <i class="fas fa-exclamation-circle mr-2"></i>{{ errorMessage }}
  </div>

  <!-- Users Table -->
  <div *ngIf="!isLoading && users.length > 0" class="bg-white rounded-lg shadow-md overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-800 text-white">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">ID</th>
          <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Username</th>
          <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Email</th>
          <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Role</th>
          <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let user of users" class="hover:bg-gray-50">
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ user.userId }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ user.username }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">{{ user.email }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm">
            <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full"
                  [ngClass]="{
                    'bg-purple-100 text-purple-800': user.roles.includes('ADMIN'),
                    'bg-green-100 text-green-800': !user.roles.includes('ADMIN')
                  }">
              {{ user.roles }}
            </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">
            <button class="text-blue-600 hover:text-blue-900 mr-3" title="View Details">
              <i class="fas fa-eye"></i>
            </button>
            <button class="text-yellow-600 hover:text-yellow-900 mr-3" title="Edit">
              <i class="fas fa-edit"></i>
            </button>
            <button class="text-red-600 hover:text-red-900" title="Delete">
              <i class="fas fa-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Empty State -->
  <div *ngIf="!isLoading && users.length === 0" class="text-center py-12">
    <i class="fas fa-users text-gray-400 text-6xl mb-4"></i>
    <p class="text-gray-600 text-xl">No users found</p>
  </div>
</div>
