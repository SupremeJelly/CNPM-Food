apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-exporter
  template:
    metadata:
      labels:
        app: github-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9118"
    spec:
      containers:
      - name: exporter
        # use a known-working image tag on nodes; replace with your registry/image as needed
        image: onlykohi/github-exporter:8376db06
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9118
        env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-secret
              key: token
        - name: LOKI_PUSH_URL
          value: "http://loki-stack.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        # If Loki requires an auth header, create a secret `github-exporter-loki-secret` with key `auth` and
        # add it back here. For now we remove the LOKI_AUTH_HEADER reference to avoid CreateContainerConfigError.
        # To enable workflow metrics, set `GITHUB_REPO` below to the repo you want to monitor, e.g. "owner/repo".
        - name: GITHUB_REPO
          value: "SupremeJelly/CNPM-Food"
        # Prometheus annotations alternative: use Service below
---
apiVersion: v1
kind: Service
metadata:
  name: github-exporter
  namespace: monitoring
  labels:
    app: github-exporter
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9118"
spec:
  ports:
  - port: 9118
    targetPort: 9118
    protocol: TCP
    name: metrics
  selector:
    app: github-exporter