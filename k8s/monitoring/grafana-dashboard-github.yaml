---
# Grafana dashboard (ConfigMap) for GitHub exporter (Prometheus metrics)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-github
  namespace: monitoring
data:
  github-exporter-dashboard.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "uid": "github-exporter",
      "title": "GitHub Exporter - CNPM Food",
      "schemaVersion": 38,
      "version": 1,
      "panels": [
        {
          "type": "stat",
          "title": "🚨 Failing Workflows",
          "datasource": "Prometheus",
          "gridPos": {"h": 3, "w": 3, "x": 0, "y": 0},
          "targets": [ { "expr": "count(github_workflow_failed_job == 1) by (workflow) or vector(0)", "refId": "A" } ],
          "options": {
            "graphMode": "none",
            "colorMode": "background",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": null, "color": "green"},
                  {"value": 1, "color": "red"}
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "❌ Failing Jobs",
          "datasource": "Prometheus",
          "gridPos": {"h": 3, "w": 3, "x": 3, "y": 0},
          "targets": [ { "expr": "count(github_workflow_failed_job == 1) or vector(0)", "refId": "A" } ],
          "options": {
            "graphMode": "none",
            "colorMode": "background",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": null, "color": "green"},
                  {"value": 1, "color": "orange"},
                  {"value": 3, "color": "red"}
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "🧪 Failed Tests",
          "datasource": "Prometheus",
          "gridPos": {"h": 3, "w": 3, "x": 6, "y": 0},
          "targets": [ { "expr": "sum(github_workflow_testcase_failed_total) or vector(0)", "refId": "A" } ],
          "options": {
            "graphMode": "none",
            "colorMode": "background",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": null, "color": "green"},
                  {"value": 1, "color": "red"}
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "✅ Exporter",
          "datasource": "Prometheus",
          "gridPos": {"h": 3, "w": 3, "x": 9, "y": 0},
          "targets": [ { "expr": "up{job=~\"github-exporter.*\"}", "refId": "A" } ],
          "options": {
            "graphMode": "none",
            "colorMode": "background",
            "textMode": "name"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}}},
                {"type": "value", "options": {"1": {"text": "UP", "color": "green"}}}
              ]
            }
          }
        },
        {
          "type": "gauge",
          "title": "Rate Limit",
          "datasource": "Prometheus",
          "gridPos": {"h": 3, "w": 3, "x": 12, "y": 0},
          "targets": [ { "expr": "github_rate_limit_remaining", "refId": "A" } ],
          "options": {
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "fieldConfig": {
            "defaults": {
              "max": 5000,
              "min": 0,
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": null, "color": "red"},
                  {"value": 1000, "color": "orange"},
                  {"value": 3000, "color": "green"}
                ]
              }
            }
          }
        },

        {
          "type": "table",
          "title": "🔴 Failing Jobs",
          "datasource": "Prometheus",
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 3},
          "targets": [ { 
            "expr": "github_workflow_failed_job == 1", 
            "refId": "A",
            "format": "table",
            "instant": true
          } ],
          "options": {
            "showHeader": true,
            "sortBy": [{"displayName": "Time", "desc": true}]
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "width": "auto"
              }
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "workflow"},
                "properties": [
                  {"id": "custom.width", "value": 250},
                  {"id": "custom.displayMode", "value": "color-background"},
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "dark-red"}}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "job"},
                "properties": [
                  {"id": "custom.width", "value": 250},
                  {"id": "custom.displayMode", "value": "color-background"},
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "dark-orange"}}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "Value"},
                "properties": [
                  {"id": "custom.width", "value": 80},
                  {"id": "custom.displayMode", "value": "color-text"},
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}},
                  {"id": "mappings", "value": [{"type": "value", "options": {"1": {"text": "FAILED", "color": "red"}}}]}
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {"Time": true, "__name__": true, "instance": true, "exported_job": true, "app": true, "kubernetes_namespace": true, "kubernetes_pod_name": true, "pod_template_hash": true},
                "indexByName": {"workflow": 0, "job": 1},
                "renameByName": {"workflow": "Workflow", "job": "Job"}
              }
            },
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "names": ["Workflow", "Job"]
                }
              }
            }
          ]
        },
        {
          "type": "table",
          "title": "⏰ Last Failed",
          "datasource": "Prometheus",
          "gridPos": {"h": 6, "w": 7, "x": 8, "y": 3},
          "targets": [ { 
            "expr": "github_workflow_last_failed_timestamp_seconds * 1000", 
            "refId": "A",
            "format": "table",
            "instant": true
          } ],
          "options": {
            "showHeader": true,
            "sortBy": [{"displayName": "Last Failed", "desc": true}]
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "workflow"},
                "properties": [
                  {"id": "custom.width", "value": 300},
                  {"id": "custom.displayMode", "value": "color-background"},
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "dark-blue"}}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "Value"},
                "properties": [
                  {"id": "unit", "value": "dateTimeAsIso"},
                  {"id": "custom.width", "value": 200},
                  {"id": "custom.displayMode", "value": "color-background"},
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "dark-purple"}}
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {"Time": true, "__name__": true, "instance": true, "job": true},
                "indexByName": {"workflow": 0, "Value": 1},
                "renameByName": {"Value": "Last Failed", "workflow": "Workflow Name"}
              }
            }
          ]
        },
        {
          "type": "table",
          "title": "🧪 Failed Test Cases",
          "datasource": "Prometheus",
          "gridPos": {"h": 8, "w": 15, "x": 0, "y": 9},
          "targets": [ { 
            "expr": "topk(15, github_workflow_testcase_failed_total > 0)", 
            "refId": "A", 
            "format": "table", 
            "instant": true 
          } ],
          "options": {
            "showHeader": true,
            "sortBy": [{"displayName": "Count", "desc": true}],
            "footer": {
              "show": true,
              "reducer": ["sum"],
              "fields": ["Count"]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "Test"},
                "properties": [
                  {"id": "custom.width", "value": 600},
                  {"id": "custom.displayMode", "value": "color-background"},
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "dark-red"}}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "Count"},
                "properties": [
                  {"id": "custom.width", "value": 80},
                  {"id": "custom.displayMode", "value": "basic"},
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {"Time": true, "__name__": true, "instance": true, "app": true, "exported_job": true, "kubernetes_namespace": true, "kubernetes_pod_name": true, "pod_template_hash": true, "workflow": true, "job": true},
                "indexByName": {"testcase": 0, "Value": 1},
                "renameByName": {"Value": "Count", "testcase": "Test"}
              }
            }
          ]
        },
        {
          "type": "logs",
          "title": "📋 Failure Details (Steps & Tests)",
          "datasource": "Loki",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 17},
          "targets": [ { 
            "expr": "{app=\"github-exporter\"} |~ \"FAILED:|step=|TEST_FAIL:|TEST_SUMMARY:\"", 
            "refId": "A" 
          } ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "dedupStrategy": "exact",
            "enableLogDetails": true,
            "prettifyLogMessage": false
          }
        }
      ],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"}
    }
