---
# Grafana dashboard (ConfigMap) for GitHub exporter (Prometheus metrics)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-github
  namespace: monitoring
data:
  github-exporter-dashboard.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "uid": "github-exporter",
      "title": "GitHub Exporter - CNPM Food",
      "schemaVersion": 38,
      "version": 1,
      "panels": [
        {
          "type": "stat",
          "title": "🚨 Failing Workflows",
          "datasource": "Prometheus",
          "gridPos": {"h": 4, "w": 4, "x": 0, "y": 0},
          "targets": [ { "expr": "github_total_failing_workflows", "refId": "A" } ],
          "options": {
            "graphMode": "none",
            "colorMode": "background",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": null, "color": "green"},
                  {"value": 1, "color": "red"}
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "❌ Failing Jobs",
          "datasource": "Prometheus",
          "gridPos": {"h": 4, "w": 4, "x": 4, "y": 0},
          "targets": [ { "expr": "github_total_failing_jobs", "refId": "A" } ],
          "options": {
            "graphMode": "none",
            "colorMode": "background",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": null, "color": "green"},
                  {"value": 1, "color": "orange"},
                  {"value": 3, "color": "red"}
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "Exporter Up",
          "datasource": "Prometheus",
          "gridPos": {"h": 4, "w": 4, "x": 8, "y": 0},
          "targets": [ { "expr": "up{job=~\"github-exporter.*\"}", "refId": "A" } ],
          "options": {
            "graphMode": "none",
            "colorMode": "background"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}}},
                {"type": "value", "options": {"1": {"text": "UP", "color": "green"}}}
              ]
            }
          }
        },
        {
          "type": "timeseries",
          "title": "GitHub API Request Rate",
          "datasource": "Prometheus",
          "gridPos": {"h": 6, "w": 6, "x": 12, "y": 0},
          "targets": [ { "expr": "rate(github_requests_total[5m])", "refId": "A" } ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10
              }
            }
          }
        },
        {
          "type": "gauge",
          "title": "Rate Limit Remaining",
          "datasource": "Prometheus",
          "gridPos": {"h": 6, "w": 6, "x": 18, "y": 0},
          "targets": [ { "expr": "github_rate_limit_remaining", "refId": "A" } ],
          "fieldConfig": {
            "defaults": {
              "max": 5000,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": null, "color": "red"},
                  {"value": 1000, "color": "orange"},
                  {"value": 3000, "color": "green"}
                ]
              }
            }
          }
        },

        {
          "type": "table",
          "title": "🔴 Workflow Failing Jobs",
          "datasource": "Prometheus",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 6},
          "targets": [ { 
            "expr": "github_workflow_failed_job == 1", 
            "refId": "A",
            "format": "table",
            "instant": true
          } ],
          "options": {
            "showHeader": true,
            "sortBy": [{"displayName": "Time", "desc": true}]
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "width": "auto"
              }
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "workflow"},
                "properties": [
                  {"id": "custom.width", "value": 250},
                  {"id": "custom.displayMode", "value": "color-background"},
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "dark-red"}}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "job"},
                "properties": [
                  {"id": "custom.width", "value": 250},
                  {"id": "custom.displayMode", "value": "color-background"},
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "dark-orange"}}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "Value"},
                "properties": [
                  {"id": "custom.width", "value": 80},
                  {"id": "custom.displayMode", "value": "color-text"},
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}},
                  {"id": "mappings", "value": [{"type": "value", "options": {"1": {"text": "FAILED", "color": "red"}}}]}
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {"Time": true, "__name__": true, "instance": true, "job": false},
                "indexByName": {"workflow": 0, "job": 1, "Value": 2},
                "renameByName": {"Value": "Status", "workflow": "Workflow", "job": "Job Name"}
              }
            }
          ]
        },
        {
          "type": "table",
          "title": "⏰ Last Failed Time (per workflow)",
          "datasource": "Prometheus",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 6},
          "targets": [ { 
            "expr": "github_workflow_last_failed_timestamp_seconds * 1000", 
            "refId": "A",
            "format": "table",
            "instant": true
          } ],
          "options": {
            "showHeader": true,
            "sortBy": [{"displayName": "Last Failed", "desc": true}]
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "workflow"},
                "properties": [
                  {"id": "custom.width", "value": 300},
                  {"id": "custom.displayMode", "value": "color-background"},
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "dark-blue"}}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "Value"},
                "properties": [
                  {"id": "unit", "value": "dateTimeAsIso"},
                  {"id": "custom.width", "value": 200},
                  {"id": "custom.displayMode", "value": "color-background"},
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "dark-purple"}}
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {"Time": true, "__name__": true, "instance": true, "job": true},
                "indexByName": {"workflow": 0, "Value": 1},
                "renameByName": {"Value": "Last Failed", "workflow": "Workflow Name"}
              }
            }
          ]
        },
        {
          "type": "table",
          "title": "⚙️ Failed Steps (by Job)",
          "datasource": "Prometheus",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 14},
          "targets": [ { 
            "expr": "github_workflow_step_failed_total > 0", 
            "refId": "A", 
            "format": "table", 
            "instant": true 
          } ],
          "options": {
            "showHeader": true,
            "sortBy": [{"displayName": "Failures", "desc": true}]
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "step"},
                "properties": [
                  {"id": "custom.width", "value": 300},
                  {"id": "custom.displayMode", "value": "color-background"},
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "dark-orange"}}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "Value"},
                "properties": [
                  {"id": "custom.displayMode", "value": "lcd-gauge"},
                  {"id": "color", "value": {"mode": "thresholds"}},
                  {"id": "thresholds", "value": {
                    "mode": "absolute",
                    "steps": [
                      {"value": null, "color": "green"},
                      {"value": 1, "color": "red"}
                    ]
                  }}
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {"Time": true, "__name__": true, "instance": true},
                "indexByName": {"workflow": 0, "job": 1, "step": 2, "Value": 3},
                "renameByName": {"Value": "Failures", "workflow": "Workflow", "job": "Job", "step": "Step Name"}
              }
            }
          ]
        },
        {
          "type": "table",
          "title": "🧪 Failed Test Cases",
          "datasource": "Prometheus",
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 14},
          "targets": [ { 
            "expr": "topk(20, github_workflow_testcase_failed_total > 0)", 
            "refId": "A", 
            "format": "table", 
            "instant": true 
          } ],
          "options": {
            "showHeader": true,
            "sortBy": [{"displayName": "Failures", "desc": true}],
            "footer": {
              "show": true,
              "reducer": ["sum"],
              "fields": ["Failures"]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "testcase"},
                "properties": [
                  {"id": "custom.width", "value": 400},
                  {"id": "custom.displayMode", "value": "color-background"},
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "dark-red"}}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "Value"},
                "properties": [
                  {"id": "custom.width", "value": 80},
                  {"id": "custom.displayMode", "value": "lcd-gauge"},
                  {"id": "color", "value": {"mode": "thresholds"}},
                  {"id": "min", "value": 0},
                  {"id": "max", "value": 10},
                  {"id": "thresholds", "value": {
                    "mode": "absolute",
                    "steps": [
                      {"value": null, "color": "green"},
                      {"value": 1, "color": "red"}
                    ]
                  }}
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {"Time": true, "__name__": true, "instance": true, "workflow": false, "job": false},
                "indexByName": {"testcase": 0, "Value": 1},
                "renameByName": {"Value": "Failures", "testcase": "Test Case"}
              }
            }
          ]
        },
        {
          "type": "logs",
          "title": "📋 Workflow Failure Logs",
          "datasource": "Loki",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 20},
          "targets": [ { 
            "expr": "{app=\"github-exporter\"} |~ \"FAILED|step=|TEST_FAIL\"", 
            "refId": "A" 
          } ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false
          }
        }
      ],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"}
    }
