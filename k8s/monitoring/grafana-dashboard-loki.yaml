---
# Simple Grafana dashboard for Loki logs
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-loki
  namespace: monitoring
data:
  loki-logs-dashboard.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "uid": "loki-logs",
      "title": "Logs - CNPM Food",
      "schemaVersion": 38,
      "version": 1,
      "panels": [
        {
          "type": "logs",
          "title": "Recent Logs (cnpm-food namespace)",
          "datasource": "Loki",
          "gridPos": {"h": 9, "w": 24, "x": 0, "y": 0},
          "options": {
            "showLabels": true,
            "showTime": true,
            "wrapLogMessage": false
          },
          "targets": [
            {
              "expr": "{namespace=\"cnpm-food\"}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Ingest Rate (entries/s)",
          "datasource": "Prometheus",
          "gridPos": {"h": 4, "w": 12, "x": 0, "y": 9},
          "targets": [ { "expr": "rate(loki_ingester_received_entries_total[5m])", "refId": "A" } ]
        },
        {
          "type": "timeseries",
          "title": "Query Duration (p95)",
          "datasource": "Prometheus",
          "gridPos": {"h": 4, "w": 12, "x": 12, "y": 9},
          "targets": [ { "expr": "histogram_quantile(0.95, sum(rate(loki_request_duration_seconds_bucket[5m])) by (le))", "refId": "A" } ]
        },
        {
          "type": "timeseries",
          "title": "Query Errors (rate)",
          "datasource": "Prometheus",
          "gridPos": {"h": 4, "w": 12, "x": 0, "y": 13},
          "targets": [ { "expr": "rate(loki_request_errors_total[5m])", "refId": "A" } ]
        },
        {
          "type": "stat",
          "title": "Active Streams",
          "datasource": "Prometheus",
          "gridPos": {"h": 4, "w": 12, "x": 12, "y": 13},
          "targets": [ { "expr": "sum(loki_ingester_active_streams)", "refId": "A" } ]
        }
      ],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"}
    }
