---
# Namespace cho monitoring
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring

---
# ConfigMap cho Prometheus config
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
      external_labels:
        cluster: 'docker-desktop'
        environment: 'development'

    # Recording rules for pre-aggregated metrics
    rule_files:
      - '/etc/prometheus/rules/*.yml'

    scrape_configs:
      # Scrape Prometheus itself
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Spring Boot microservices - User Service
      - job_name: 'user-service'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 3s
        static_configs:
          - targets: ['user-service.cnpm-food.svc.cluster.local:8081']
            labels:
              app: 'user-service'
              service_type: 'backend'
              tier: 'application'

      # Spring Boot microservices - Restaurant Service
      - job_name: 'restaurant-service'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 3s
        static_configs:
          - targets: ['restaurant-service.cnpm-food.svc.cluster.local:8082']
            labels:
              app: 'restaurant-service'
              service_type: 'backend'
              tier: 'application'

      # Spring Boot microservices - Order Service
      - job_name: 'order-service'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 3s
        static_configs:
          - targets: ['order-service.cnpm-food.svc.cluster.local:8083']
            labels:
              app: 'order-service'
              service_type: 'backend'
              tier: 'application'

      # Spring Boot microservices - Payment Service
      - job_name: 'payment-service'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 3s
        static_configs:
          - targets: ['payment-service.cnpm-food.svc.cluster.local:8085']
            labels:
              app: 'payment-service'
              service_type: 'backend'
              tier: 'application'

      # API Gateway
      - job_name: 'api-gateway'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 3s
        static_configs:
          - targets: ['api-gateway.cnpm-food.svc.cluster.local:9000']
            labels:
              app: 'api-gateway'
              service_type: 'gateway'
              tier: 'edge'

---
# ConfigMap for Prometheus Recording Rules
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  recording-rules.yml: |
    groups:
      - name: cnpm_food_recording_rules
        interval: 5s
        rules:
          # Request rate per service
          - record: job:http_requests:rate5m
            expr: sum(rate(http_server_requests_seconds_count[5m])) by (job, app)
          
          # Error rate per service
          - record: job:http_errors:rate5m
            expr: sum(rate(http_server_requests_seconds_count{status=~"4..|5.."}[5m])) by (job, app)
          
          # Average response time
          - record: job:http_request_duration:avg
            expr: rate(http_server_requests_seconds_sum[5m]) / rate(http_server_requests_seconds_count[5m])
          
          # JVM memory usage percentage
          - record: job:jvm_memory:usage_ratio
            expr: jvm_memory_used_bytes / jvm_memory_max_bytes
          
          # Database connection pool usage
          - record: job:hikaricp_connections:usage_ratio
            expr: hikaricp_connections_active / hikaricp_connections_max

  alert-rules.yml: |
    groups:
      - name: cnpm_food_alerts
        interval: 10s
        rules:
          # Service down alert
          - alert: ServiceDown
            expr: up{job=~".*-service|api-gateway"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Service {{ $labels.job }} is down"
              description: "{{ $labels.job }} has been down for more than 1 minute."
          
          # High error rate alert
          - alert: HighErrorRate
            expr: |
              sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (app) 
              / 
              sum(rate(http_server_requests_seconds_count[5m])) by (app) 
              > 0.05
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High error rate on {{ $labels.app }}"
              description: "Error rate is {{ $value | humanizePercentage }} on {{ $labels.app }}"
          
          # High memory usage alert
          - alert: HighMemoryUsage
            expr: job:jvm_memory:usage_ratio > 0.9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage on {{ $labels.app }}"
              description: "Memory usage is {{ $value | humanizePercentage }} on {{ $labels.app }}"
          
          # Slow response time alert
          - alert: SlowResponseTime
            expr: job:http_request_duration:avg > 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Slow response time on {{ $labels.app }}"
              description: "Average response time is {{ $value }}s on {{ $labels.app }}"

---
# Prometheus Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v2.47.0
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
          - '--web.console.libraries=/usr/share/prometheus/console_libraries'
          - '--web.console.templates=/usr/share/prometheus/consoles'
          - '--web.enable-lifecycle'
        ports:
        - containerPort: 9090
          name: web
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-rules
          mountPath: /etc/prometheus/rules
        - name: prometheus-storage
          mountPath: /prometheus
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-rules
        configMap:
          name: prometheus-rules
      - name: prometheus-storage
        emptyDir: {}

---
# Prometheus Service
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  type: NodePort
  ports:
  - port: 9090
    targetPort: 9090
    nodePort: 30090
    protocol: TCP
    name: web
  selector:
    app: prometheus

---
# ServiceAccount for Prometheus
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring

---
# ClusterRole for Prometheus
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups:
  - extensions
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]

---
# ClusterRoleBinding for Prometheus
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: monitoring
