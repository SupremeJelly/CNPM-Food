apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cnpm-food-services
  namespace: cnpm-food
  labels:
    release: monitoring  # Must match Prometheus Operator release name
spec:
  selector:
    matchLabels:
      # This will match all services with these labels
      app: user-service
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 15s
---
