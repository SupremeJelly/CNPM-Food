apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: cnpm-food
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: onlykohi/cnpm-api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9000
          name: http
        env:
        - name: USER_SERVICE_URL
          value: "http://user-service:8081"
        - name: RESTAURANT_SERVICE_URL
          value: "http://restaurant-service:8082"
        - name: ORDER_SERVICE_URL
          value: "http://order-service:8083"
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-service:8085"
        - name: SPRING_AUTOCONFIGURE_EXCLUDE
          value: "org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration"
        - name: MANAGEMENT_HEALTH_REDIS_ENABLED
          value: "false"
        - name: SPRING_CLOUD_GATEWAY_GLOBALCORS_ADD-TO-SIMPLE-URL-HANDLER-MAPPING
          value: "true"
        - name: ALLOWED_ORIGINS
          value: "http://localhost,http://localhost:4200,http://localhost:80"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 9000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: cnpm-food
  labels:
    app: api-gateway
spec:
  type: LoadBalancer
  ports:
  - port: 9000
    targetPort: 9000
    protocol: TCP
    name: http
  selector:
    app: api-gateway

