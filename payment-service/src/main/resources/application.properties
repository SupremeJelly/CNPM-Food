spring.application.name=payment-service
server.port=8085

spring.datasource.url=jdbc:mysql://localhost:3306/payment_db?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=paymentservice
spring.datasource.password=pay
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# tắt eureka client
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Actuator configuration for Prometheus monitoring
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=payment-service
