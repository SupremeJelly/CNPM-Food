spring.application.name=restaurant-service
spring.datasource.url=jdbc:mysql://localhost:3306/restaurant_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=restaurantservice
spring.datasource.password=res
spring.jpa.hibernate.ddl-auto=update
server.port=8082

# Use /app/uploads in production (Docker/K8s), fallback to src/main/resources/uploads for local dev
file.upload-dir=${UPLOAD_DIR:/app/uploads}

# file upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#openapi
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.htmls

#eureka.instance.prefer-ip-address=true
# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

app.base-url=http://localhost:8082

# ==============================================================
# CẤU HÌNH MONITORING (ACTUATOR + PROMETHEUS)
# ==============================================================
# 1. Mở các endpoints cần thiết (Health check và Prometheus)
management.endpoints.web.exposure.include=health,info,prometheus

# 2. Bật tính năng thu thập metrics cho Prometheus
management.endpoint.prometheus.enabled=true

# 3. Gắn nhãn tên App vào từng metric (Để lên Grafana biết là của order-service)
management.metrics.tags.application=${spring.application.name}

# 4. (Tùy chọn) Hiển thị chi tiết health check
management.endpoint.health.show-details=always

management.metrics.distribution.percentiles-histogram.http.server.requests=true