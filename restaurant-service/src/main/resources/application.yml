eureka:
  client:
      serviceUrl:
        defaultZone: http://localhost:8761/eureka/
  instance:
      preferIpAddress: true

# Actuator configuration for Prometheus monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name:restaurant-service}

