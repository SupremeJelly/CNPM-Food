spring.application.name=user-service

# Database - sử dụng biến môi trường hoặc default
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/user_db?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:userservice}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:user}
spring.jpa.hibernate.ddl-auto=update

server.port=8081

# JWT - sử dụng biến môi trường hoặc default
jwt.secretKey=${JWT_SECRET_KEY:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
jwt.expiration=${JWT_EXPIRATION:86400000}

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Notification service
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8084/api/v1/notifications}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}

# File upload
file.upload-dir=${FILE_UPLOAD_DIR:src/main/resources/uploads}
app.base-url=${APP_BASE_URL:http://localhost:8081}

# Upload size limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true


