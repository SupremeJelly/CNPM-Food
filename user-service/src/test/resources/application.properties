# Test configuration - overrides main application.properties
spring.application.name=user-service

# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Disable Eureka for tests
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Test server port
server.port=0

# JWT settings for tests
jwt.secretKey=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000

# Mock service URLs for tests
notification.service.url=http://localhost:8084/api/v1/notifications
app.frontend.url=http://localhost:4200
restaurant.service.url=http://localhost:8082
order.service.url=http://localhost:8083

# File upload (test directory)
file.upload-dir=target/test-uploads
app.base-url=http://localhost:8081

# Disable multipart for unit tests (enable in integration tests if needed)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator for tests
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging for tests (set to DEBUG if you need detailed logs)
logging.level.root=INFO
logging.level.com.vanhuy.user_service=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=ERROR
