# Whether to install CRDs for monitoring
crds:
  # -- Whether to install CRDs for monitoring.
  create: true

## Various Alloy settings. For backwards compatibility with the grafana-agent
## chart, this field may also be called "agent". Naming this field "agent" is
## deprecated and will be removed in a future release.
alloy:
  configMap:
    # -- Create a new ConfigMap for the config file.
    create: true
    # Alloy configuration content (HCL format)
    # Combine with remote config for microservices scraping
    content: |-
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["cnpm-food", "default"]
        }
      }
      
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
          regex         = "true"
          action        = "keep"
        }
        
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
          regex         = "(.+)"
          target_label  = "__metrics_path__"
          action        = "replace"
        }
        
        rule {
          source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
          regex         = "([^:]+)(?::\\d+)?;(\\d+)"
          replacement   = "$1:$2"
          target_label  = "__address__"
          action        = "replace"
        }
        
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "service"
          action        = "replace"
        }
        
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
          action        = "replace"
        }
        
        rule {
          replacement   = "kohi-local-dev"
          target_label  = "cluster"
          action        = "replace"
        }
      }
      
      prometheus.scrape "microservices" {
        targets    = discovery.relabel.pods.output
        forward_to = [prometheus.remote_write.grafana_cloud.receiver]
        scrape_interval = "15s"
        scrape_timeout  = "10s"
      }
      
      prometheus.scrape "alloy_internal" {
        targets = [{
          __address__ = "127.0.0.1:12345",
          cluster     = "kohi-local-dev",
          job         = "alloy",
        }]
        forward_to = [prometheus.remote_write.grafana_cloud.receiver]
        scrape_interval = "15s"
      }
      
      prometheus.remote_write "grafana_cloud" {
        endpoint {
          url = "https://prometheus-prod-37-prod-ap-southeast-1.grafana.net/api/prom/push"
          basic_auth {
            username = "2808529"
            password = env("GCLOUD_RW_API_KEY")
          }
        }
      }
    
  # Enable remote configuration from Grafana Cloud Fleet Management
  # Disabled: using local config to scrape microservices
  remoteConfig:
    enabled: false
    url: https://fleet-management-prod-013.grafana.net
    auth:
      type: basic
      username: "1445833"
      password: "glc_eyJvIjoiMTU5MzAwMCIsIm4iOiJmbGVldC1mbGVldC10b2tlbiIsImsiOiI0a3hmUHZPTDVCOTZzSTZWWW0zNkU0MTkiLCJtIjp7InIiOiJ1cyJ9fQ=="
  
  # Extra environment variables for Fleet Management integration
  extraEnv:
    - name: GCLOUD_RW_API_KEY
      value: "glc_eyJvIjoiMTU5MzAwMCIsIm4iOiJzdGFjay0xNDQyMTQ4LWhtLXdyaXRlLWJvbWJhY2xhdCIsImsiOiJacU44bjIyNnpjNnRYVDZVMzFtR200SDQiLCJtIjp7InIiOiJwcm9kLWFwLXNvdXRoZWFzdC0xIn19"
    - name: CLUSTER_NAME
      value: "docker-desktop"
    - name: NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: GCLOUD_FM_COLLECTOR_ID
      value: "grafana-k8s-monitoring-$(CLUSTER_NAME)-$(NAMESPACE)-$(POD_NAME)"

  # Deploy Alloy in cluster mode (disabled for single-node setup)
  clustering:
    # -- Deploy Alloy in a cluster to allow for load distribution.
    enabled: false

  # Minimum stability level of components to enable
  stabilityLevel: "generally-available"

## Configure controller settings (DaemonSet/Deployment)
controller:
  # -- Type of controller to use. Valid values are: 'daemonset', 'deployment', 'statefulset'
  type: 'daemonset'
  
  # -- Extra labels to add to all Alloy pods
  podLabels:
    app.kubernetes.io/part-of: grafana-k8s-monitoring
    cluster: docker-desktop

  # -- Path to where Grafana Alloy stores data (for example, the Write-Ahead Log).
  # By default, data is lost between reboots.
  storagePath: /tmp/alloy
  
  # Listen address for Alloy UI (0.0.0.0 exposes to other containers)
  listenAddr: 0.0.0.0

  # -- Port to listen for traffic on.
  listenPort: 12345

  # -- Scheme is needed for readiness probes. If enabling tls in your configs, set to "HTTPS"
  listenScheme: HTTP

  # Volume mounts for log collection
  mounts:
    # -- Mount /var/log from the host into the container for log collection.
    varlog: false
    # -- Mount /var/lib/docker/containers from the host into the container for log
    # collection.
    dockercontainers: false

  # Resource requests and limits for Alloy container
  resources: {}

# Grafana Alloy image configuration
image:
  # -- Grafana Alloy image registry (defaults to docker.io)
  registry: "docker.io"
  # -- Grafana Alloy image repository.
  repository: grafana/alloy
  pullPolicy: IfNotPresent

# RBAC permissions for Kubernetes service discovery
rbac:
  # -- Whether to create RBAC resources for Alloy.
  create: true
  # Rules for discovering services, pods, endpoints
  rules:
    # -- Rules required for the `discovery.kubernetes` component.
    - apiGroups: ["", "discovery.k8s.io", "networking.k8s.io"]
      resources: ["endpoints", "endpointslices", "ingresses", "pods", "services"]
      verbs: ["get", "list", "watch"]
    # -- Rules required for the `loki.source.kubernetes` component.
    - apiGroups: [""]
      resources: ["pods", "pods/log", "namespaces"]
      verbs: ["get", "list", "watch"]
  # Cluster-level rules for node metrics
  clusterRules:
    # -- Rules required for the `discovery.kubernetes` component.
    - apiGroups: [""]
      resources: ["nodes", "nodes/proxy", "nodes/metrics"]
      verbs: ["get", "list", "watch"]

# ServiceAccount for Alloy pods
serviceAccount:
  # -- Whether to create a service account for the Grafana Alloy deployment.
  create: true

# Config reloader sidecar (auto-reload on ConfigMap changes)
configReloader:
  # -- Enables automatically reloading when the Alloy config changes.
  enabled: true
  image:
    # -- Config reloader image registry (defaults to docker.io)
    registry: "quay.io"
    # -- Repository to get config reloader image from.
    repository: prometheus-operator/prometheus-config-reloader
    # -- Tag of image to use for config reloading.
    tag: v0.81.0
  resources:
    requests:
      cpu: "10m"
      memory: "50Mi"

# Service to expose Alloy UI
service:
  # -- Creates a Service for the controller's pods.
  enabled: true
  # -- Service type
  type: ClusterIP